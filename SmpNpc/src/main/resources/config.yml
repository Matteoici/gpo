# =====================================================================
#  SmpNpc - PNJ médiévaux qui se promènent
#  Créer une zone : place-toi au centre et tape  /pnj zone creer spawn 25 12
#  (nom, rayon en blocs, nombre de PNJ).   Après une modification : /pnj reload
# =====================================================================

# vitesse de marche (blocs par seconde ; un joueur marche à ~4.3)
speed: 1.6
# pause entre deux marches (secondes, au hasard entre min et max)
pause-min: 2
pause-max: 7
# ils regardent les joueurs à moins de X blocs pendant leurs pauses
look-at-players: 6
# afficher le nom et le métier au-dessus de la tête
show-names: true

# ---------------------------------------------------------------- Skins
# Liste vide = skins Minecraft par défaut (Steve, Alex, Kai...) au hasard.
# Deux façons d'ajouter un skin :
#  1) le pseudo d'un compte Minecraft qui a ce skin :
#       - name: "UnPseudo"
#  2) depuis mineskin.org : envoie ton fichier PNG, puis copie "Texture Value" et "Texture Signature" :
#       - value: "ewogICJ0aW1lc3RhbXAiIDog..."
#         signature: "AbCdEf..."
#  Tu peux aussi réserver un skin à un métier :  profession: forgeron
skins: []

