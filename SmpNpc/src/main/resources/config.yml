# ---------------------------------------------------------------- Phrases (clic droit sur un PNJ)
phrases:
  - "Le bonjour, voyageur !"
  - "Belle journée pour le commerce, n'est-ce pas ?"
  - "Méfie-toi des bandits sur la route du Nether..."
  - "As-tu visité les échoppes du marché ? On y trouve de tout !"
  - "On dit qu'une caisse tombe du ciel toutes les trois heures..."
  - "Le roi de la colline approche, prépare ton épée !"
  - "Par ma barbe, quelle armure tu portes !"
  - "Les quêtes du jour rapportent gros, crois-moi."
  - "Je ne vends rien, passe ton chemin... ou pas !"
  - "Garde ton argent en lieu sûr, des primes circulent..."

# format du message
chat-format: "<gray>[<white><name></white>] <#e8d9b0><phrase>"
