config-version: 2
# =====================================================================
#  SmpCrates - caisses payées avec l'argent du jeu
#  - /caisse                     -> menu de toutes les caisses (voir les lots, acheter, ouvrir)
#  - /caisse placer <caisse>     -> en regardant un bloc (coffre, ender chest...) : il devient cette caisse
#  - /caisse retirer             -> en regardant une caisse
#  - /caisse ajouter <caisse> <poids>  -> ajoute l'objet que tu tiens comme lot (avec ses enchantements, son nom...)
#  - /caisse cle <joueur> <caisse> [n] -> donne des clés (ouvertures gratuites)
#  - /caisse editer <caisse>     -> menu pour tout changer en jeu : nom, prix, couleur, apparence, clé seulement, lots et chances
#  - /caisse creer <id>          -> nouvelle caisse (vide, à remplir avec /caisse editer)   ·   /caisse supprimer <id>
#  Lots : poids = chance relative (un lot de poids 20 sort 2 fois plus qu'un lot de poids 10).
#   item: MATERIAU, amount, name, enchants {sharpness: 5}  |  money: 10000  |  command: "..." (%player%) + name + icon
#   broadcast: true -> tout le serveur est prévenu
#  Après une modification : /caisse reload
# =====================================================================

# ouvrir depuis le menu /caisse n'importe où (sinon : seulement en cliquant sur la caisse posée)
open-anywhere: true
# annonce à tout le serveur pour ces caisses (en plus des lots "broadcast: true")
broadcast-crates: [legendaire, mythique, premium]

