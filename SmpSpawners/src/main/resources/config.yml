# ============================================================ SmpSpawners
# Un spawner posé ne fait apparaître AUCUN mob : il "tue" son mob tout seul et stocke l'XP et le butin dedans.
# Clic droit dessus = menu pour tout récupérer. Pas de mobs = pas de lag, pas de glitch, pas de ferme à construire.
config-version: 1

production:
  # il faut un joueur à moins de X blocs pour que le spawner produise (comme en vanilla) ; false = produit dès que le chunk est chargé
  require-player-nearby: true
  player-range: 32

storage:
  # place dans un spawner, multipliée par le nombre de spawners empilés dedans
  items-per-stack: 2304      # 36 piles de 64
  xp-per-stack: 5000

limits:
  max-stack: 64              # spawners empilés au même endroit
  max-per-chunk: 16
  # seul celui qui l'a posé peut l'ouvrir / le casser (les admins aussi)
  owner-only: true

# un spawner "vanilla" avec un mob (acheté au marché, au shop...) devient un spawner sans mob à la pose
convert-vanilla-spawners: true
# casser un spawner naturel (donjon...) avec Toucher de soie donne un spawner de ce mob
natural-silk-touch: true
# petit texte au-dessus des spawners
hologram: true

# Raretés du tirage au hasard (spawner mystère). weight = chances relatives ; interval = secondes entre 2 "kills".
rarities:
  commun:     {name: "Commun",     color: "<gray>",         weight: 58,  interval: 30}
  peu-commun: {name: "Peu commun", color: "<green>",        weight: 26,  interval: 40}
  rare:       {name: "Rare",       color: "<aqua>",         weight: 11,  interval: 60}
  epique:     {name: "Épique",     color: "<light_purple>", weight: 4.3, interval: 90}
  legendaire: {name: "Légendaire", color: "<gold>",         weight: 0.7, interval: 180}

# Mobs : rareté, XP par kill, butin par kill ("OBJET min-max [chance%]"). interval: pour changer celui de la rareté.
