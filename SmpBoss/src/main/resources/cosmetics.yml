# =====================================================================
#  Modèles 3D des cosmétiques de reliques (blocs miniatures, aucun pack de textures).
#  Coordonnées en blocs depuis les PIEDS du joueur :  x = vers sa GAUCHE, y = vers le haut, z = vers l'AVANT.
#  Repères du corps : dos z = -0.12, torse z = +0.12, côtés x = ±0.235, épaules y = 1.41,
#                     tête de y 1.41 à 1.88 (x et z ±0.235), taille (ceinture) y = 0.70.
#  block: bloc (états possibles : "lantern[hanging=true]"), at: centre, size: taille, rot: rotation [x, y, z] en degrés
#  item: objet affiché (centré), scale: taille.  bright: true = toujours éclairé.  glow: "#rrggbb" = contour lumineux.
#  anchor : body (suit le corps), head (suit la tête), orbit (tourne autour du joueur)
#  Pour modifier : copie ce fichier dans plugins/SmpBoss/cosmetics.yml, change-le puis /boss reload.
# =====================================================================

