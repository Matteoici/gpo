config-version: 2

# =====================================================================
#  SmpBoss - le Roi Citrouille
#  1) /boss autel en regardant le bloc de ton arène qui sert d'autel
#  2) les joueurs farment des Graines maudites (zombies, squelettes...)
#  3) 8 graines + 1 citrouille taillée (établi) = Citrouille sacrificielle
#  4) la nuit, clic droit sur l'autel avec la citrouille = le boss apparaît
#  Après une modification : /boss reload
# =====================================================================

# ---------------------------------------------------------------- Graines maudites
seeds:
  enabled: true
  # chance (%) qu'un de ces monstres lâche une graine quand un joueur le tue
  chance: 4
  mobs: [ZOMBIE, SKELETON, HUSK, STRAY, DROWNED, ZOMBIE_VILLAGER, BOGGED]
  # les monstres de spawners en lâchent aussi ?
  from-spawners: false

# ---------------------------------------------------------------- Le boss
boss:
  # vie PROPORTIONNELLE au nombre de combattants : X PV par joueur.
  # Compte les joueurs présents au réveil, puis chaque nouveau joueur qui le frappe ajoute X PV
  # (le pourcentage de vie restant ne change pas).
  health-per-player: 1200
  # tableau sur le côté de l'écran : vie + part des dégâts de chacun (vert = assez pour le butin)
  damage-sidebar: true
  # taille (1 = taille normale) puis à chaque phase
  scale: 3.0
  scale-phase-2: 3.6
  scale-phase-3: 4.2
  phase-2-at: 0.66
  phase-3-at: 0.33
  speed: 0.24
  melee-damage: 9
  # pause entre deux attaques spéciales (ticks : 20 = 1 seconde)
  attack-interval:
    "1": 110
    "2": 90
    "3": 70
  orbit-count: 4
  minions: 4
  seed-rain-count: 14
  # rayon de l'arène autour de l'autel (il ne peut pas en sortir)
  arena-radius: 18
  night-only: true
  cooldown-minutes: 30
  max-minutes: 20
  damage:
    multiplier: 1.0
    barrage: 8
    vines: 4
    flame-wave: 7
    minion: 6
    seed-rain: 6
    slam: 12
    spikes: 7
    scythe: 10
    charge: 9
    meteor: 14
    phase-shockwave: 4
    # coups d'épée (combo) et coup final qui fend le sol
    sword: 7
    sword-finisher: 11
    fissure: 8
    # phase 3 (Roi Sans Tête)
    eclipse: 8
    soul-blade: 15
    carillon: 9
    leap: 14
    leap-ring: 6
    feast: 3
    # tous les dégâts sont multipliés par ça en phase 3
    phase-3-multiplier: 1.6
  # phase 2 à 50 % de vie ; à 0 il fait le mort puis revient en phase 3 avec TOUTE sa vie
  phase-2-at-v2: 0.5
  phase-3-health-multiplier: 1.0
  scale-phase-3-v2: 4.6
  attack-interval-phase-3: 55
  # chance qu'il enchaîne une 2e attaque en phase 3
  phase-3-combo-chance: 0.4
  # Festin : % de sa vie max qu'il récupère à chaque morsure
  feast-heal-percent: 1.0
  scythe-radius: 6.5

# ---------------------------------------------------------------- Arène infernale
# /boss arene construire [taille] : construit l'arène là où tu es (l'autel au centre, crâne-portail au nord)
# /boss arene definir <rayon> : protège une arène que tu as collée toi-même (WorldEdit)
arena:
  # brume rouge, spores et braises pour les joueurs dans l'arène
  ambience: true
  # blocs posés par tick pendant la construction (baisse si le serveur rame)
  blocks-per-tick: 4000
  protection:
    enabled: true
    # personne ne casse / pose (sauf permission smpboss.arena.bypass), pas de feu, pas d'explosions
    blocks: true
    # pas de PvP (coups, flèches, potions, loups...)
    pvp: true
    # aucun monstre n'apparaît (sauf le boss et ses serviteurs) et ceux qui entrent disparaissent
    mobs: true
    # tomber dans la lave du décor = renvoyé sur le sol (sans dégâts)
    lava-rescue: true
    # le magma des fissures ne brûle pas les pieds
    decor-safe: true

# ---------------------------------------------------------------- Butin
loot:
  # il faut avoir fait au moins X % des dégâts pour être récompensé
  min-damage-percent: 5
  # chances en %, tirées dans cet ordre (secret, puis légendaire...)
  chances:
    secret: 0.5
    legendary: 1
    epic: 5
    rare: 20
  # garantie : au bout de X victoires sans en avoir eu, c'est sûr
  pity:
    legendary: 150
    secret: 300
  # pour tout le monde à chaque victoire (%player%)
  always-commands:
    - "tokens give %player% 15"
    - "eco give %player% 25000"
  # graines rendues (min, max)
  always-seeds: [1, 3]
  pools:
    rare:
      - {relic: trainee_flammes}
      - {item: CARVED_PUMPKIN, name: "Chapeau du Roi", lore: ["<gray>Un souvenir du Roi Citrouille."]}
    epic:
      - {relic: amulette_recolte}
      - {relic: lanterne_mineure}
    legendary:
      - {relic: couronne}
      - {relic: lanterne_eternelle}
      - {relic: bottes_recolte}
    secret:
      - {relic: sac_recolte, title: "Celui qui a dévoré la Récolte"}
      - {sickle: true, title: "Faucheur du Néant"}

# ---------------------------------------------------------------- Reliques
# health = cœurs en plus · speed = % de vitesse · regen = demi-cœurs toutes les 4 s hors combat (8 s sans dégâts)
# trail = particules sous les pieds · backpack = le sac (27 cases)
# visual = cosmétique visible : backpack (sac à dos), crown (couronne flottante), lantern (lanterne à la ceinture),
#          wisp (feu follet d'âme sur l'épaule), amulet (amulette), boots (feuilles d'automne), flames (empreintes de feu)
# item-model = modèle du pack de textures (plus tard, ex. "monserveur:couronne")
relics:
  max-equipped: 2
  list:
    trainee_flammes:
      name: "Traînée de Flammes"
      rarity: rare
      icon: BLAZE_POWDER
      visual: flames
      lore: ["<gray>Tes pas laissent des braises."]
      trail: FLAME
    amulette_recolte:
      name: "Amulette de la Récolte"
      rarity: epic
      icon: GOLDEN_CARROT
      visual: amulet
      lore: ["<gray>Bénie par les champs."]
      speed: 2
    lanterne_mineure:
      name: "Lanterne Mineure"
      rarity: epic
      icon: LANTERN
      visual: lantern
      lore: ["<gray>Une petite flamme réconfortante."]
      regen: 0.5
    couronne:
      name: "Couronne du Roi Citrouille"
      rarity: legendary
      icon: GOLDEN_HELMET
      visual: crown
      lore: ["<gray>Arrachée au Roi en personne."]
      health: 1
    lanterne_eternelle:
      name: "Lanterne Éternelle"
      rarity: legendary
      icon: SOUL_LANTERN
      visual: wisp
      lore: ["<gray>Sa flamme ne s'éteint jamais."]
      regen: 1
    bottes_recolte:
      name: "Bottes de la Récolte"
      rarity: legendary
      icon: GOLDEN_BOOTS
      visual: boots
      lore: ["<gray>On ne rattrape pas le vent d'automne."]
      speed: 5
    sac_recolte:
      name: "Sac de la Récolte"
      rarity: secret
      icon: BUNDLE
      visual: backpack
      lore: ["<gray>Il a appartenu au Roi... et il est toujours chaud."]
      backpack: true

# ---------------------------------------------------------------- Sac (relique secrète)
backpack:
  # sac à dos visible (modèle en blocs : tissu, rabat orange, couverture roulée, mini citrouille)
  show-on-back: true
  # % des objets du sac qui tombent à la mort (au hasard)
  drop-percent-on-death: 70

# ---------------------------------------------------------------- Boutons en haut de l'inventaire
# Sac + Cosmétiques dans la grille d'artisanat 2×2 (ils s'effacent dès qu'on y pose un objet)
inventory-buttons:
  enabled: true

# ---------------------------------------------------------------- Faucille (arme secrète)
sickle:
  damage: 8
  attack-speed: 1.6
  lifesteal-mobs: 10
  lifesteal-players: 4
  cooldown-seconds: 20
  harvest-range: 4.5
  harvest-damage: 9
  harvest-damage-players: 5

# ---------------------------------------------------------------- Modèles du pack de textures (plus tard)
# ex. backpack: "monserveur:sac"   (laisser vide = apparence de base)
models:
  backpack: ""
  sickle: ""
  seed: ""
  sacrifice: ""

