config-version: 15

# =====================================================================
#  SmpBoss - le Roi Citrouille
#  1) /boss autel en regardant le bloc de ton arène qui sert d'autel
#  2) les joueurs farment des Graines maudites (zombies, squelettes...)
#  3) 8 graines + 1 citrouille taillée (établi) = Citrouille sacrificielle
#  4) clic droit sur l'autel avec la citrouille = le boss apparaît
#  Après une modification : /boss reload
# =====================================================================

# ---------------------------------------------------------------- Graines maudites
seeds:
  enabled: true
  # chance (%) qu'un de ces monstres lâche une graine quand un joueur le tue
  chance: 4
  mobs: [ZOMBIE, SKELETON, HUSK, STRAY, DROWNED, ZOMBIE_VILLAGER, BOGGED]
  # les monstres de spawners en lâchent aussi ?
  from-spawners: false

# ---------------------------------------------------------------- Le boss
boss:
  # vie PROPORTIONNELLE au nombre de combattants : X PV par joueur.
  # Compte les joueurs présents au réveil, puis chaque nouveau joueur qui le frappe ajoute X PV
  # (le pourcentage de vie restant ne change pas).
  health-per-player: 1800
  # chaque joueur en plus ajoute X de cette vie (0.7 = 70 %) : venir en équipe va plus vite
  extra-player-health: 0.7
  # dégâts des coups à l'épée / à la hache sur le boss (1.3 = +30 % ; l'arc reste normal)
  melee-bonus: 1.3
  # tableau sur le côté de l'écran : vie + part des dégâts de chacun (vert = assez pour le butin)
  damage-sidebar: true
  # taille (1 = taille normale) puis à chaque phase
  scale: 3.0
  scale-phase-2: 3.6
  scale-phase-3: 4.2
  phase-2-at: 0.66
  phase-3-at: 0.33
  speed: 0.27
  melee-damage: 12
  # agrandit toutes les zones d'attaque (1 = taille d'origine, 1.5 = 50 % plus grandes)
  zone-scale: 1.5
  # pause entre deux attaques spéciales (ticks : 20 = 1 seconde)
  attack-interval:
    "1": 75
    "2": 60
    "3": 42
  orbit-count: 4
  minions: 6
  seed-rain-count: 22
  # rayon de l'arène autour de l'autel (il ne peut pas en sortir)
  arena-radius: 18
  night-only: false
  cooldown-minutes: 15
  max-minutes: 20
  damage:
    multiplier: 1.35
    barrage: 8
    vines: 4
    flame-wave: 7
    minion: 6
    seed-rain: 6
    slam: 12
    spikes: 7
    scythe: 10
    charge: 9
    meteor: 14
    phase-shockwave: 4
    # coups d'épée (combo) et coup final qui fend le sol
    sword: 7
    sword-finisher: 11
    fissure: 8
    # phase 3 (Roi Sans Tête)
    eclipse: 8
    soul-blade: 15
    carillon: 9
    leap: 14
    leap-ring: 6
    feast: 3
    # nouvelles attaques
    nova: 22
    cross: 7
    cage: 16
    cage-touch: 5
    tornado: 6
    hands: 8
    # multiplicateur des dégâts par phase
    phase-1-multiplier: 1.3
    phase-2-multiplier: 1.45
    phase-3-multiplier: 1.5
    # part de chaque coup qui traverse l'armure (seuls les enchantements Protection la réduisent)
    # 0.3 = 30 % ; sans ça, une armure en netherite enchantée ne prend presque rien
    armor-pierce: 0.3
    armor-pierce-phase-3: 0.3
    # Jugement Dernier : ceux qui sont juste à côté du cercle (projetés)
    judgment-blast: 4
    # Apocalypse : un météore ; ceux qui survivent dans l'abri
    apocalypse-meteor: 6
    apocalypse-shelter: 4
  # phase 2 quand il lui reste 70 % de vie ; à 0 il fait le mort puis revient en phase 3 (voir phase-3-health-multiplier)
  # usure de l'armure pendant le combat (0.25 = 4 fois moins vite que d'habitude)
  armor-wear: 0.25
  phase-2-at-v2: 0.7
  # vie de la phase 3 (Roi Sans Tête) par rapport à la vie de départ (0.6 = 60 %)
  phase-3-health-multiplier: 0.6
  scale-phase-3-v2: 4.6
  attack-interval-phase-3: 48
  # chance d'enchaîner une 2e attaque juste après (phase 2 / phase 3)
  phase-2-combo-chance: 0.25
  # Jugement Infernal : temps pour rejoindre un cercle vert (ticks)
  nova-warning-ticks: 70
  # sous ce % de vie en phase 3 il devient ENRAGÉ (plus rapide, +25 % de dégâts, enchaîne toujours)
  enrage-at: 0.3
  # JUGEMENT DERNIER (phase 3, une seule fois) : citrouille géante, mort instantanée dans le cercle rouge
  # se déclenche quand il reste X de la vie de la phase 3 ; rayon du cercle ; taille de la citrouille
  judgment-at: 0.55
  judgment-radius: 14
  judgment-size: 16
  # citrouille du Jugement : temps pour se placer au-dessus de la cible, puis temps de chute (20 ticks = 1 s)
  judgment-travel-ticks: 50
  judgment-fall-ticks: 40
  # APOCALYPSE (phase 3, une seule fois, après le Jugement) : sous X de vie de la phase 3
  # 1) vagues de météores sur chaque joueur  2) toute l'arène explose sauf UN abri (cercle d'âmes qui rétrécit)
  apocalypse-at: 0.15
  apocalypse-meteor-waves: 4
  apocalypse-meteor-radius: 4
  # temps pour rejoindre l'abri (ticks) ; rayon de l'abri au début et à la fin
  apocalypse-countdown-ticks: 120
  apocalypse-shelter-start-radius: 6.5
  apocalypse-shelter-radius: 4
  apocalypse-eclipse-size: 14
  # Gardes du Roi : tant qu'il en reste un, le Roi ne prend que X des dégâts (0.3 = 30 %)
  guard-shield: 0.3
  guard-health: 40
  guard-health-per-player: 15
  guard-damage: 9
  # chance qu'il enchaîne une 2e attaque en phase 3
  phase-3-combo-chance: 0.5
  # Festin : % de sa vie max qu'il récupère à chaque morsure
  feast-heal-percent: 0.0
  scythe-radius: 6.5

# ---------------------------------------------------------------- Arène infernale
# /boss arene construire [taille] : construit l'arène là où tu es (l'autel au centre, crâne-portail au nord)
# /boss arene definir <rayon> : protège une arène que tu as collée toi-même (WorldEdit)
arena:
  # brume rouge, spores et braises pour les joueurs dans l'arène
  ambience: true
  # protection d'arrivée : X secondes sans prendre de dégâts en entrant dans l'arène (/arene, portail)
  # elle s'arrête dès qu'on frappe le boss. 0 = désactivée
  spawn-protection-seconds: 6
  # mourir dans l'arène ne fait rien perdre (inventaire, niveaux, sac)
  keep-inventory: true
  # bords de l'écran teintés de rouge dans l'arène (0.05 = léger, 0.95 = très rouge)
  red-tint: true
  red-tint-strength: 0.6
  # le portail au fond du crâne fait sortir avec cette commande (console)
  exit-command: "spawn %player%"
  # blocs posés par tick pendant la construction (baisse si le serveur rame)
  blocks-per-tick: 4000
  protection:
    enabled: true
    # personne ne casse / pose (sauf permission smpboss.arena.bypass), pas de feu, pas d'explosions
    blocks: true
    # pas de PvP (coups, flèches, potions, loups...)
    pvp: true
    # aucun monstre n'apparaît (sauf le boss et ses serviteurs) et ceux qui entrent disparaissent
    mobs: true
    # tomber dans la lave du décor = renvoyé sur le sol (sans dégâts)
    lava-rescue: true
    # le magma des fissures ne brûle pas les pieds
    decor-safe: true
    # pas d'élytres ni de charges de vent (sinon combos masse)
    no-elytra: true
    no-wind-charge: true
    # potions de saut sans effet dans l'arène (sinon sauts géants pour la masse)
    no-jump-effects: true
    # ender pearls interdites dans l'arène (lancer, entrer ou sortir avec)
    no-ender-pearl: true
    # lances (spear) inutilisables dans l'arène (pas de ruée / coups de lance)
    no-spear: true
    # anti-cheese : les coups / flèches sur le Roi ne comptent que depuis la piste de combat
    # (pas depuis le pont du portail, le muret, les piliers ou l'extérieur)
    floor-only-damage: true
    # marge en blocs autour du bord de la piste
    floor-margin: 0.5
    blocked-effects: [jump_boost, levitation]

# ---------------------------------------------------------------- Butin
loot:
  # il faut avoir fait au moins X % des dégâts pour être récompensé
  min-damage-percent: 5
  # chances en %, tirées dans cet ordre (secret, puis légendaire...)
  chances:
    secret: 0.5
    legendary: 1
    epic: 5
    rare: 20
  # garantie : au bout de X victoires sans en avoir eu, c'est sûr
  pity:
    legendary: 150
    secret: 300
  # pour tout le monde à chaque victoire (%player%)
  always-commands:
    - "tokens give %player% 15"
    - "eco give %player% 25000"
  # graines rendues (min, max)
  always-seeds: [1, 3]
  pools:
    rare:
      - {relic: trainee_flammes}
      - {relic: braises_ardentes}
      - {relic: crane_maudit}
      - {item: CARVED_PUMPKIN, name: "Chapeau du Roi", lore: ["<gray>Un souvenir du Roi Citrouille."]}
    epic:
      - {relic: amulette_recolte}
      - {relic: lanterne_mineure}
      - {relic: cornes_demon}
      - {relic: orbe_infernal}
    legendary:
      - {relic: couronne}
      - {relic: lanterne_eternelle}
      - {relic: bottes_recolte}
      - {relic: ailes_demon}
      - {relic: oeil_jugement}
    secret:
      - {relic: sac_recolte, title: "Celui qui a dévoré la Récolte"}
      - {sickle: true, title: "Faucheur du Néant"}
      - {relic: couronne_enfers, title: "Souverain des Enfers"}
      - {relic: cape_nuit, title: "Enfant de la Nuit Éternelle"}

# ---------------------------------------------------------------- Reliques
# health = cœurs en plus · speed = % de vitesse · regen = demi-cœurs toutes les 4 s hors combat (8 s sans dégâts)
# trail = particules sous les pieds · backpack = le sac (27 cases)
# visual = cosmétique visible : backpack (sac à dos), crown (couronne flottante), lantern (lanterne à la ceinture),
#          wisp (feu follet d'âme sur l'épaule), amulet (amulette), boots (feuilles d'automne), flames (empreintes de feu)
# item-model = modèle du pack de textures (plus tard, ex. "monserveur:couronne")
relics:
  max-equipped: 2
  list:
    trainee_flammes:
      name: "Traînée de Flammes"
      rarity: rare
      icon: BLAZE_POWDER
      visual: flames
      lore: ["<gray>Tes pas laissent des braises."]
      trail: FLAME
    amulette_recolte:
      name: "Amulette de la Récolte"
      rarity: epic
      icon: GOLDEN_CARROT
      visual: amulet
      lore: ["<gray>Bénie par les champs."]
      speed: 2
    lanterne_mineure:
      name: "Lanterne Mineure"
      rarity: epic
      icon: LANTERN
      visual: lantern
      lore: ["<gray>Une petite flamme réconfortante."]
      regen: 0.5
    couronne:
      name: "Couronne du Roi Citrouille"
      rarity: legendary
      icon: GOLDEN_HELMET
      visual: crown
      lore: ["<gray>Arrachée au Roi en personne."]
      health: 1
    lanterne_eternelle:
      name: "Lanterne Éternelle"
      rarity: legendary
      icon: SOUL_LANTERN
      visual: wisp
      lore: ["<gray>Sa flamme ne s'éteint jamais."]
      regen: 1
    bottes_recolte:
      name: "Bottes de la Récolte"
      rarity: legendary
      icon: GOLDEN_BOOTS
      visual: boots
      lore: ["<gray>On ne rattrape pas le vent d'automne."]
      speed: 5
    sac_recolte:
      name: "Sac de la Récolte"
      rarity: secret
      icon: BUNDLE
      visual: backpack
      lore: ["<gray>Il a appartenu au Roi... et il est toujours chaud."]
      backpack: true
    # ------- arrivées avec l'arène infernale (damage = % de dégâts en plus, armor = points d'armure)
    braises_ardentes:
      name: "Braises Ardentes"
      rarity: rare
      icon: MAGMA_CREAM
      visual: embers
      lore: ["<gray>Des braises de l'arène tournent autour de toi."]
      armor: 1
    crane_maudit:
      name: "Crâne Maudit"
      rarity: rare
      icon: WITHER_SKELETON_SKULL
      visual: skull
      lore: ["<gray>Il flotte sur ton épaule et murmure des noms."]
      damage: 3
    cornes_demon:
      name: "Cornes du Démon"
      rarity: epic
      icon: GOAT_HORN
      visual: horns
      lore: ["<gray>Arrachées au crâne de la porte des Enfers."]
      damage: 6
    orbe_infernal:
      name: "Orbes Infernaux"
      rarity: epic
      icon: MAGMA_BLOCK
      visual: orbs
      lore: ["<gray>Trois éclats de magma te protègent."]
      health: 1
      armor: 2
    ailes_demon:
      name: "Ailes du Démon"
      rarity: legendary
      icon: PHANTOM_MEMBRANE
      visual: wings
      lore: ["<gray>Elles ne volent pas... mais quelle allure."]
      speed: 4
      health: 1
    oeil_jugement:
      name: "Œil du Jugement"
      rarity: legendary
      icon: ENDER_EYE
      visual: halo
      lore: ["<gray>Celui qui a survécu au Jugement Infernal."]
      damage: 8
      regen: 0.5
    couronne_enfers:
      name: "Couronne des Enfers"
      rarity: secret
      icon: NETHERITE_HELMET
      visual: hellcrown
      lore: ["<gray>Forgée dans la lave de l'arène.", "<gray>Seul un souverain la porte."]
      health: 2
      damage: 10
      armor: 2
    cape_nuit:
      name: "Cape de la Nuit Éternelle"
      rarity: secret
      icon: BLACK_BANNER
      visual: cape
      lore: ["<gray>Taillée dans le ciel de la bulle rouge."]
      speed: 6
      regen: 1

# ---------------------------------------------------------------- Sac (relique secrète)
backpack:
  # sac à dos visible (modèle en blocs : tissu, rabat orange, couverture roulée, mini citrouille)
  show-on-back: true
  # % des objets du sac qui tombent à la mort (au hasard)
  drop-percent-on-death: 70

# ---------------------------------------------------------------- Boutons en haut de l'inventaire
# Sac + Cosmétiques dans la grille d'artisanat 2×2 (ils s'effacent dès qu'on y pose un objet)
# ---------------------------------------------------------------- Cosmétiques 3D des reliques
# couronne, ailes, cornes... visibles sur les joueurs (false = cachés, les reliques gardent leurs bonus)
cosmetics:
  enabled: true
  # expérimental : accrochés au joueur côté client (false = replacés sur le joueur à chaque tick, toujours bien placés)
  attach: false

# texte flottant au-dessus de l'autel (comment réveiller le Roi + état)
altar-hologram: true

inventory-buttons:
  enabled: true
  # le totem "Cosmétiques & Reliques" dans l'inventaire (sinon : /reliques ou le menu du serveur)
  cosmetics: false

# ---------------------------------------------------------------- Faucille (arme secrète)
sickle:
  damage: 8
  attack-speed: 1.6
  lifesteal-mobs: 10
  lifesteal-players: 4
  cooldown-seconds: 20
  harvest-range: 4.5
  harvest-damage: 9
  harvest-damage-players: 5

# ---------------------------------------------------------------- Modèles du pack de textures (plus tard)
# ex. backpack: "monserveur:sac"   (laisser vide = apparence de base)
models:
  backpack: ""
  sickle: ""
  seed: ""
  sacrifice: ""

