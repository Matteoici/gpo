name: SmpBoss
version: '${version}'
main: fr.smpboss.SmpBoss
api-version: '26.2'
softdepend: [WorldGuard, SmpShop, Vault, ProtocolLib]
description: Boss (Roi Citrouille), reliques, sac à dos, faucille
commands:
  pack:
    description: Recharger le resource pack du serveur (si tu ne vois pas les effets)
    usage: /pack
    aliases: [resourcepack, texturepack]
  boss:
    description: Administration des boss
    usage: /boss <autel|invoquer|stop|give|arene>
    permission: smpboss.admin
  reliques:
    description: Tes reliques
    usage: /reliques
    aliases: [relics, relique, cosmetiques, cosmetique, butin]
  arene:
    description: Aller dans l'arène du boss
    usage: /arene [araignee]
    aliases: [arena, arène]
    permission: smpboss.arena.join
  topguildes:
    description: Classement des guildes contre le boss
    usage: /topguildes
    aliases: [topguilde, guildtop, topguild, classementguildes]
  drops:
    description: Chances de drop du Roi Citrouille
    usage: /drops
    aliases: [chances, loottable]
  sac:
    description: Ouvrir ton sac (relique)
    usage: /sac
    aliases: [backpack, bp]
permissions:
  smpboss.admin:
    description: Gérer les boss
    default: op
  smpboss.arena.join:
    description: /arene
    default: true
  smpboss.arena.bypass:
    description: Casser / poser des blocs dans l'arène du boss
    default: op
