name: SmpBoss
version: '${version}'
main: fr.smpboss.SmpBoss
api-version: '26.2'
softdepend: [WorldGuard, SmpShop, Vault]
description: Boss (Roi Citrouille), reliques, sac à dos, faucille
commands:
  boss:
    description: Administration des boss
    usage: /boss <autel|invoquer|stop|give|info>
    permission: smpboss.admin
  reliques:
    description: Tes reliques
    usage: /reliques
    aliases: [relics, relique]
  sac:
    description: Ouvrir ton sac (relique)
    usage: /sac
    aliases: [backpack, bp]
permissions:
  smpboss.admin:
    description: Gérer les boss
    default: op
