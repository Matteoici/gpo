        plugin: "GpoTrade"
        description: "Écrit /trade dans le chat, ajoute un pseudo"
      guild:
        name: "Guilde"
        command: "guild"
        plugin: "SmpGuilds"
        description: "Menu de ta guilde"

  progression:
    name: "Progression"
    color: "light_purple"
    description: "Quêtes, récompenses, caisses, kits"
