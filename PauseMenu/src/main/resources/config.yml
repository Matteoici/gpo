    description: "Boutique, vente, marché, primes"
    buttons:
      shop:
        name: "Boutique"
        command: "shop"
        plugin: "DonutShop"
        description: "Acheter des objets"
      sell:
        name: "Vendre"
        command: "sell"
        plugin: "DonutSell"
        description: "Vendre tes objets"
      orders:
        name: "Commandes joueurs"
