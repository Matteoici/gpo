# ============================================================================
#  PauseMenu : boutons cliquables dans le menu Echap de Minecraft
# ============================================================================
#  Le plugin génère un datapack (dialogues Minecraft). Après CHAQUE changement
#  de ce fichier : /pausemenu reload, puis REDÉMARRE le serveur, puis les
#  joueurs se reconnectent.
#
#  Un bouton n'apparaît que si le plugin indiqué dans "plugin:" est installé.
#  Laisse "plugin:" vide pour qu'il soit toujours affiché.
#  mode: run      -> exécute la commande directement
#  mode: suggest  -> écrit la commande dans le chat (pour les commandes avec un pseudo)
#  Les commandes sont à écrire SANS le "/". Vérifie-les avec celles de ton serveur !
# ============================================================================

# Titre de la fenêtre et texte du bouton dans le menu Echap
title: "Menu du serveur"
button-label: "★ Menu du serveur ★"
title-color: "gold"

# true  = une seule fenêtre avec tous les boutons
# false = une fenêtre d'accueil avec des catégories
flat: false

# Nombre de colonnes de boutons
columns: 2
button-width: 150

# Dossier du datapack. "auto" = <monde principal>/datapacks
datapacks-folder: auto

# Ajouter aussi le menu au raccourci "Actions rapides" (touche configurable en jeu)
quick-actions: true

categories:
  deplacements:
    name: "Déplacements"
    color: "aqua"
    description: "Spawn, maisons, warps, téléportation"
    buttons:
      spawn:
        name: "Spawn"
        command: "spawn"
        plugin: "EssentialsSpawn"
        description: "Retourner au spawn"
      rtp:
        name: "Téléportation aléatoire"
        command: "rtp"
        plugin: "JustRTP"
        description: "Partir explorer un lieu au hasard"
      homes:
        name: "Mes maisons"
        command: "homes"
        plugin: "Essentials"
        description: "Liste de tes homes"
      warps:
        name: "Warps"
        command: "warps"
        plugin: "Essentials"
        description: "Liste des warps du serveur"
      afk:
        name: "Mode AFK"
        command: "afk"
        plugin: "Essentials"
        description: "Te mettre / sortir du mode AFK"

  economie:
