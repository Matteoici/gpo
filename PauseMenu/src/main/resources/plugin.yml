name: PauseMenu
version: '${version}'
main: fr.pausemenu.PauseMenuPlugin
api-version: '26.2'
description: Boutons cliquables des plugins dans le menu pause (Echap) de Minecraft
commands:
  pausemenu:
    description: Gérer le menu pause
    usage: /pausemenu [list|reload]
    aliases: [pm-menu, servermenu]
    permission: pausemenu.use
permissions:
  pausemenu.use:
    description: Utiliser /pausemenu list
    default: true
  pausemenu.admin:
    description: /pausemenu reload
    default: op
