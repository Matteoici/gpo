# =====================================================================
#  SmpGojo - techniques de l'infini (admins seulement : smpgojo.use)
#  /gojo kit et /sukuna kit = les techniques en objets (clic droit pour lancer)
# =====================================================================

# temps de recharge (secondes)
cooldowns:
  bleu: 3
  rouge: 3
  violet: 8
  nuke: 30
  domaine: 40
  # Sukuna
  demantelement: 2
  clivage: 4
  fuga: 15
  taille: 30
  sanctuaire: 45

damage:
  bleu: 4
  rouge: 8
  violet: 30
  nuke: 40
  # Sukuna
  demantelement: 6
  # Clivage : base + (pourcentage x vie max de la cible)
  clivage-base: 6
  clivage-percent: 0.3
  fuga: 25
  # Taille du monde : traverse l'Infini de Gojo
  taille: 60
  # Sanctuaire : dégâts à chaque coupure (4 par seconde)
  sanctuaire: 2

# Violet creux et Nuke peuvent creuser le terrain (false = aucun bloc touché)
destroy-blocks: false
# si oui, le terrain se reconstruit tout seul après X secondes
restore-seconds: 20

domain:
  radius: 12
  seconds: 10

nuke:
  radius: 22
  distance: 30

# ----------------------------------------------------------- Sukuna (/sukuna kit)
fuga:
  radius: 7

taille:
  length: 40
  width: 14

sanctuaire:
  radius: 20
  seconds: 10
