# =====================================================================
#  SmpGojo - Jujutsu Kaisen pour les admins (permission smpgojo.use)
#  /gojo kit · /sukuna kit · /megumi kit · /yuji kit · /jjk kit tout
#  /jjk reparer = reconstruire le terrain tout de suite · /jjk stop
# =====================================================================

# ------------------------------------------------------------ mise en scène
cinematic:
  # images d'impact plein écran (flashs noir / blanc / couleur)
  impact-frames: true
  # tremblements de caméra
  shake: true

# ------------------------------------------------------------ destruction
# Les techniques cassent vraiment le terrain (rien ne tombe en objet),
# puis tout se reconstruit tout seul. Jamais : coffres, fours, panneaux,
# bedrock, liquides. Même après un crash, le terrain est remis au démarrage.
destroy-blocks: true
restore-seconds: 60
restore-blocks-per-tick: 500
max-blocks-per-hit: 6000
# débris qui volent (affichage seulement)
max-debris: 250
# mondes où rien n'est jamais cassé
no-destroy-worlds: []
# rayon autour du spawn du monde où rien n'est cassé (0 = aucun)
no-destroy-spawn-radius: 0

# ------------------------------------------------------------ temps de recharge (secondes)
cooldowns:
  bleu: 4
  rouge: 4
  violet: 15
  nuke: 60
  domaine: 45
  demantelement: 2
  clivage: 5
  fuga: 15
  taille: 30
  sanctuaire: 60
  chiens: 20
  nue: 8
  crapaud: 6
  serpent: 10
  mahoraga: 60
  jardin: 50
  poing: 1
  blackflash: 6
  manji: 5
  rafale: 6
  sang: 10

# ------------------------------------------------------------ dégâts
damage:
  bleu: 5
  rouge: 14
  violet: 35
  nuke: 200
  demantelement: 8
  # Clivage : base + (pourcentage x vie max de la cible)
  clivage-base: 8
  clivage-percent: 0.35
  fuga: 30
  # Taille du monde : traverse l'Infini de Gojo
  taille: 70
  # Sanctuaire : par coupure (2 par seconde)
  sanctuaire: 2
  chiens: 8
  nue: 16
  crapaud: 4
  serpent: 14
  mahoraga: 22
  mahoraga-saut: 18
  jardin: 2
  poing: 8
  blackflash: 30
  manji: 16
  rafale: 1.5
  uppercut: 10
  sang: 24

# ------------------------------------------------------------ Gojo
bleu:
  ticks: 80
  pull-radius: 13
  crater: 5
rouge:
  radius: 6
violet:
  radius: 4.5
  ticks: 70
# Violet creux 200 % : une boule violette géante envoyée droit devant, à l'horizontale.
# Elle avance au rythme où le serveur efface (jamais plus de "max-ms-per-tick" par tick :
# pas de lag) ; tout ce qu'elle touche disparaît au moment où elle passe.
nuke:
  # rayon de la boule (le tunnel fera cette taille)
  radius: 55
  # distance parcourue par la boule
  length: 150
  # vitesse de la boule (blocs par tick) : elle ralentit si l'effacement prend du retard
  min-speed: 0.6
  max-speed: 4
  # durée maximum (ticks, 20 = 1 s)
  max-ticks: 1200
  # temps de calcul maximum par tick (ms, un tick = 50) : 30 laisse 20 ms au reste du serveur
  max-ms-per-tick: 30
  # le tunnel se reconstruit après (secondes)
  restore-seconds: 360
domain:
  radius: 13
  seconds: 10

# ------------------------------------------------------------ Sukuna
fuga:
  radius: 11
taille:
  length: 70
  width: 22
sanctuaire:
  radius: 26
  seconds: 10
  # à la fin du territoire, Sukuna embrase tout avec Fuga
  fuga-finish: true

# ------------------------------------------------------------ Megumi
chiens:
  seconds: 30
jardin:
  radius: 16
  seconds: 15
mahoraga:
  seconds: 120
  health: 500
  scale: 1.7
  leap-seconds: 7
  # coups d'une même technique avant qu'il s'y adapte
  hits-to-adapt-technique: 2
  # coups normaux (épée, flèches, feu...) avant adaptation
  hits-to-adapt-normal: 6
  # tentatives contre l'Infini avant de le traverser
  hits-to-adapt-infinity: 3

# ------------------------------------------------------------ Yuji
yuji:
  # chance de Black Flash sur un coup de poing (Poing divergent en main)
  black-flash-chance: 0.10
  # pareil quand il est "dans la zone" (après un Black Flash)
  black-flash-chance-zone: 0.30
  zone-seconds: 15
  black-flash-knockback: 3.2
  divergent-ratio: 0.8
  dash-range: 14
rafale:
  hits: 14
sang:
  range: 60
