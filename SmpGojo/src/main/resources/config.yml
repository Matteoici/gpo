# =====================================================================
#  SmpGojo - Jujutsu Kaisen pour les admins (permission smpgojo.use)
#  /gojo kit · /sukuna kit · /megumi kit · /yuji kit · /jjk kit tout
#  /jjk reparer = reconstruire le terrain tout de suite · /jjk stop
# =====================================================================

# ------------------------------------------------------------ mise en scène
cinematic:
  # images d'impact plein écran (flashs noir / blanc / couleur)
  impact-frames: true
  # tremblements de caméra
  shake: true

# ------------------------------------------------------------ destruction
# Les techniques cassent vraiment le terrain (rien ne tombe en objet),
# puis tout se reconstruit tout seul. Jamais : coffres, fours, panneaux,
# bedrock, liquides. Même après un crash, le terrain est remis au démarrage.
destroy-blocks: true
restore-seconds: 60
restore-blocks-per-tick: 500
max-blocks-per-hit: 6000
# débris qui volent (affichage seulement)
max-debris: 250
# mondes où rien n'est jamais cassé
no-destroy-worlds: []
# rayon autour du spawn du monde où rien n'est cassé (0 = aucun)
no-destroy-spawn-radius: 0

# ------------------------------------------------------------ temps de recharge (secondes)
cooldowns:
  bleu: 4
  rouge: 4
  violet: 15
  nuke: 15
  domaine: 45
  demantelement: 2
  clivage: 5
  fuga: 15
  taille: 30
  sanctuaire: 60
  chiens: 20
  nue: 8
  crapaud: 6
  serpent: 10
  mahoraga: 60
  jardin: 50
  poing: 1
  blackflash: 6
  manji: 5
  rafale: 6
  sang: 10
  flash8: 20
  lance: 6
  nuage: 6
  restriction: 60
  pas-eclair: 3
  boogie: 1
  boogie2: 3
  todo-poing: 8
  ratio: 5
  heures-sup: 90
  effondrement: 12
  pachinko: 90
  portes: 8
  tsar: 60
  satan: 60

# ------------------------------------------------------------ dégâts
damage:
  bleu: 5
  rouge: 14
  violet: 35
  nuke: 200
  demantelement: 8
  # Clivage : base + (pourcentage x vie max de la cible)
  clivage-base: 8
  clivage-percent: 0.35
  fuga: 30
  # Taille du monde : traverse l'Infini de Gojo
  taille: 70
  # Sanctuaire : par coupure (2 par seconde)
  sanctuaire: 2
  chiens: 8
  nue: 16
  crapaud: 4
  serpent: 14
  mahoraga: 22
  mahoraga-saut: 18
  jardin: 2
  poing: 8
  blackflash: 30
  manji: 16
  rafale: 1.5
  uppercut: 10
  sang: 24
  # 8 Black Flash : dégâts de chacun des 7 premiers (le dernier = blackflash)
  flurry: 10
  lance: 22
  nuage: 6
  pas-eclair: 10
  ratio: 24
  effondrement: 18
  billes: 1.5
  portes: 14
  # bombes : au cœur de la boule de feu
  bombe: 1000

# ------------------------------------------------------------ Gojo
bleu:
  ticks: 80
  pull-radius: 13
  crater: 5
rouge:
  radius: 6
violet:
  radius: 4.5
  ticks: 70
# Violet creux 200 % : une boule violette géante part droit devant, à l'horizontale.
# Elle efface tout sur son passage, puis au bout de "length" blocs elle explose
# en une sphère encore plus grande. Tout grandit au rythme où le serveur efface
# (jamais plus de "max-ms-per-tick" par tick : pas de lag).
nuke:
  # rayon de la boule (= taille du tunnel)
  ball-radius: 22
  # distance avant l'explosion
  length: 200
  # rayon de l'explosion finale
  radius: 55
  # vitesse max de la boule (blocs par tick) ; elle ralentit si l'effacement prend du retard
  ball-speed: 3
  min-speed: 0.6
  max-ticks: 1200
  # temps de calcul maximum par tick (ms, un tick = 50) : 30 laisse 20 ms au reste du serveur
  max-ms-per-tick: 30
  # tunnel et cratère se reconstruisent après (secondes)
  restore-seconds: 360
domain:
  radius: 13
  seconds: 10

# ------------------------------------------------------------ Sukuna
fuga:
  radius: 11
taille:
  length: 70
  width: 22
sanctuaire:
  radius: 26
  seconds: 10
  # à la fin du territoire, Sukuna embrase tout avec Fuga
  fuga-finish: true

# ------------------------------------------------------------ Megumi
chiens:
  seconds: 30
jardin:
  radius: 16
  seconds: 15
mahoraga:
  seconds: 120
  health: 500
  scale: 1.7
  leap-seconds: 7
  # coups d'une même technique avant qu'il s'y adapte
  hits-to-adapt-technique: 2
  # coups normaux (épée, flèches, feu...) avant adaptation
  hits-to-adapt-normal: 6
  # tentatives contre l'Infini avant de le traverser
  hits-to-adapt-infinity: 3

# ------------------------------------------------------------ Yuji
yuji:
  # chance de Black Flash sur un coup de poing (Poing divergent en main)
  black-flash-chance: 0.10
  # pareil quand il est "dans la zone" (après un Black Flash)
  black-flash-chance-zone: 0.30
  zone-seconds: 15
  black-flash-knockback: 3.2
  divergent-ratio: 0.8
  flurry-hits: 8
  # son joué pendant les 8 Black Flash (celui du clip, dans le pack de ressources). Vide = sons du jeu.
  flurry-sound: "smpgojo:yuji.blackflash8"
  dash-range: 14
rafale:
  hits: 14
sang:
  range: 60

# ------------------------------------------------------------ Yuji : 8 Black Flash
# (dans la section yuji plus haut : flurry-hits = nombre de Black Flash d'affilée)

# ------------------------------------------------------------ Toji
toji:
  # l'Infini de Gojo reste brisé ce temps-là après la Lance céleste inversée
  infinity-break-seconds: 10
  restriction-seconds: 30
  flash-range: 14

# ------------------------------------------------------------ Todo
todo:
  range: 40

# ------------------------------------------------------------ Nanami
nanami:
  overtime-seconds: 40
  collapse-radius: 7

# ------------------------------------------------------------ Hakari
hakari:
  radius: 14
  seconds: 25
  # chance de jackpot à chaque partie (une toutes les 5 s)
  jackpot-chance: 0.35
  # durée de l'immortalité
  jackpot-seconds: 60

# ------------------------------------------------------------ Bombes atomiques (/bombe kit)
# Boule de feu qui efface tout (budget de temps : pas de lag), onde de choc, sol brûlé,
# champignon atomique. Tout se reconstruit après "restore-seconds".
bombes:
  # distance max de visée
  range: 400
  restore-seconds: 360
  tsar:
    # rayon de la boule de feu (le cratère)
    radius: 60
    drop-height: 140
    fall-seconds: 8
    # explose à cette hauteur au-dessus du sol
    burst-height: 4
    cloud-seconds: 40
  satan:
    # nombre d'ogives et leur rayon
    warheads: 6
    radius: 22
    # écart entre les ogives autour de la cible
    spread: 45
    flight-ticks: 120
    cloud-seconds: 20

# ------------------------------------------------------------ Pack de sons
# Le son du clip des 8 Black Flash est dans SmpGojo-sons.zip.
# Mets ce zip en ligne (par ex. sur mc-packs.net), colle le lien direct et son SHA-1 ici :
# le plugin l'envoie à chaque joueur qui se connecte.
resource-pack:
  url: ""
  sha1: ""
  # true = les joueurs qui refusent le pack sont déconnectés
  required: false
