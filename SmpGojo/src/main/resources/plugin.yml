name: SmpGojo
version: '${version}'
main: fr.smpgojo.SmpGojo
api-version: '26.2'
description: Techniques de Jujutsu Kaisen pour les admins (Gojo, Sukuna, Megumi + Mahoraga, Yuji, Toji, Todo, Nanami, Hakari)
commands:
  gojo:
    description: Techniques de Satoru Gojo
    usage: /gojo [kit|infini|bleu|rouge|violet|nuke|domaine]
    permission: smpgojo.use
  sukuna:
    description: Techniques de Ryomen Sukuna
    usage: /sukuna [kit|demantelement|clivage|fuga|taille|sanctuaire]
    permission: smpgojo.use
  megumi:
    description: Techniques de Megumi Fushiguro
    usage: /megumi [kit|chiens|nue|crapaud|serpent|mahoraga|jardin]
    permission: smpgojo.use
  yuji:
    description: Techniques de Yuji Itadori
    usage: /yuji [kit|poing|blackflash|flash8|manji|rafale|sang]
    permission: smpgojo.use
  toji:
    description: Techniques de Toji Fushiguro
    usage: /toji [kit|lance|nuage|restriction|pas-eclair]
    permission: smpgojo.use
  todo:
    description: Techniques d'Aoi Todo
    usage: /todo [kit|boogie|boogie2|todo-poing]
    permission: smpgojo.use
  nanami:
    description: Techniques de Kento Nanami
    usage: /nanami [kit|ratio|heures-sup|effondrement]
    permission: smpgojo.use
  bombe:
    description: Bombes atomiques (Tsar Bomba, RS-28 Satan)
    usage: /bombe [kit|tsar|satan]
    permission: smpgojo.use
  hakari:
    description: Techniques de Kinji Hakari
    usage: /hakari [kit|pachinko|portes]
    permission: smpgojo.use
  jjk:
    description: Kits, réparation du terrain, arrêt
    usage: /jjk [kit <perso|tout>|reparer|stop|reload]
    permission: smpgojo.use
permissions:
  smpgojo.use:
    description: Utiliser les techniques
    default: op
