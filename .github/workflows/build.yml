name: Build plugins

on:
  push:
  workflow_dispatch:

jobs:
  gpotrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build GpoTrade
        working-directory: GpoTrade_1/GpoTrade
        run: gradle build
      - name: Vérifier que le jar contient bien le plugin
        working-directory: GpoTrade_1/GpoTrade
        run: |
          jar=$(ls build/libs/*.jar | head -n1)
          unzip -p "$jar" plugin.yml > /tmp/plugin.yml
          python3 -c "import yaml;yaml.safe_load(open('/tmp/plugin.yml'))" || { echo "::error::plugin.yml invalide (YAML) : le serveur refuserait de charger ce plugin"; exit 1; }
          if ! unzip -l "$jar" | grep -q "plugin.yml"; then
            echo "::error::Le jar est VIDE : le dossier src/ n'est pas à côté de build.gradle.kts dans le repo. Ré-uploade le dossier src."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GpoTrade-jar
          path: GpoTrade_1/GpoTrade/build/libs/*.jar

  smpfriends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Trouver le dossier du plugin
        id: find
        run: |
          f=$(grep -rl --include=build.gradle.kts 'fr.smpfriends' . | head -n1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build SmpFriends
