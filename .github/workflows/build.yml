          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Trouver le dossier du plugin
        id: find
        run: |
          f=$(grep -rl --include=build.gradle.kts 'fr.smpfriends' . | head -n1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build SmpFriends
