name: Build plugins

on:
  push:
  workflow_dispatch:

jobs:
  gpotrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build GpoTrade
        working-directory: GpoTrade_1/GpoTrade
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: GpoTrade-jar
          path: GpoTrade_1/GpoTrade/build/libs/*.jar

  smpfriends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Trouver le dossier du plugin
        id: find
        run: |
          f=$(grep -rl --include=build.gradle.kts 'fr.smpfriends' . | head -n1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build SmpFriends
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: SmpFriends-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar

  pausemenu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Trouver le dossier du plugin
        id: find
        run: |
          f=$(grep -rl --include=build.gradle.kts 'fr.pausemenu' . | head -n1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build PauseMenu
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: PauseMenu-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar

  smpguilds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Trouver le dossier du plugin
        id: find
        run: |
          f=$(grep -rl --include=build.gradle.kts 'fr.smpguilds' . | head -n1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build SmpGuilds
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: SmpGuilds-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
