name: Build jar
 
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
 
      - name: Build GpoTrade
        working-directory: GpoTrade_1/GpoTrade
        run: gradle build
 
      - name: Build SmpFriends
        working-directory: SmpFriends
        run: gradle build
 
      - uses: actions/upload-artifact@v4
        with:
          name: GpoTrade-jar
          path: GpoTrade_1/GpoTrade/build/libs/*.jar
 
      - uses: actions/upload-artifact@v4
        with:
          name: SmpFriends-jar
          path: SmpFriends/build/libs/*.jar
