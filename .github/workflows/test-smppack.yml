name: Test SmpPack (vrai serveur)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['SmpPack/**', '.github/workflows/test-smppack.yml', '.github/tests/**']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build SmpPack
        working-directory: SmpPack
        run: gradle build
      - name: Préparer un serveur Paper 26.2
        run: |
          mkdir -p srv/plugins/SmpPack
          url=$(curl -fsSL -H 'User-Agent: gpo-ci-test' https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/latest | jq -r '.downloads."server:default".url')
          echo "Paper : $url"
          curl -fsSL -H 'User-Agent: gpo-ci-test' -o srv/paper.jar "$url"
          cp SmpPack/build/libs/*.jar srv/plugins/
          cp packs/*.zip srv/plugins/SmpPack/pack.zip
          echo "eula=true" > srv/eula.txt
          printf 'online-mode=false\nserver-port=25565\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\n' > srv/server.properties
      - name: Démarrer le serveur
        working-directory: srv
        run: |
          mkfifo in
          (tail -f in | java -Xmx2G -jar paper.jar --nogui > log.txt 2>&1) &
          for i in $(seq 1 240); do grep -q 'Done (' log.txt && break; sleep 1; done
          grep -q 'Done (' log.txt || { cat log.txt; exit 1; }
          grep -i 'smppack' log.txt
      - name: Ping Minecraft AVANT
        run: python3 .github/tests/mcping.py 127.0.0.1 25565
      - name: Télécharger le pack par le port du jeu
        run: |
          curl -fsS -o got.zip -D head.txt 'http://127.0.0.1:25565/pack.zip?v=test'
          cat head.txt
          a=$(sha1sum got.zip | cut -d' ' -f1); b=$(sha1sum srv/plugins/SmpPack/pack.zip | cut -d' ' -f1)
          echo "reçu $a / attendu $b"; [ "$a" = "$b" ]
          curl -fsSI 'http://127.0.0.1:25565/pack.zip' | head -3
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:25565/autre); echo "autre chemin : $code"; [ "$code" = 404 ]
          # plusieurs téléchargements en même temps
          for k in 1 2 3 4 5; do curl -fsS -o g$k.zip http://127.0.0.1:25565/pack.zip & done; wait
          for k in 1 2 3 4 5; do [ "$(sha1sum g$k.zip | cut -d' ' -f1)" = "$b" ]; done; echo "5 téléchargements simultanés OK"
      - name: Ping Minecraft APRÈS (le jeu marche toujours)
        run: |
          python3 .github/tests/mcping.py 127.0.0.1 25565
          python3 .github/tests/mcping.py 127.0.0.1 25565
      - name: Logs du serveur
        if: always()
        run: |
          echo stop > srv/in || true
          sleep 5
          grep -iE 'smppack|error|exception' srv/log.txt | head -50 || true
