# =====================================================================
#  Boutique. Chaque catégorie : slot (case dans le menu principal), icon, name, lore,
#  title, rows (2 à 6), currency (money = argent, tokens = jetons) et items.
#
#  Un article :
#    material: objet donné        price: prix (pour "amount" objets)      amount: 1 par défaut
#    slot: case (sinon placé automatiquement)
#    potion: STRENGTH / STRONG_HEALING / LONG_SWIFTNESS... (pour POTION, SPLASH_POTION)
#    name / lore: objet spécial renommé
#    commands: au lieu d'un objet, lance ces commandes (%player%). icon: l'objet affiché
#  Clic gauche = choisir la quantité, clic droit = acheter 1, shift + clic = un stack.
# =====================================================================

