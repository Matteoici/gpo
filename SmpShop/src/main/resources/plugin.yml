name: SmpShop
version: '${version}'
main: fr.smpshop.SmpShop
api-version: '26.2'
depend: [Vault]
softdepend: [ProtocolLib, Essentials]
loadbefore: [DonutSell, DonutShop]
description: Boutique, vente et prix affichés sur les objets sans les modifier
commands:
  shop:
    description: Ouvrir la boutique
    usage: /shop [catégorie]
    aliases: [boutique, magasin]
  sell:
    description: Vendre ses objets
    usage: /sell [main|tout]
    aliases: [vendre]
  worth:
    description: Prix de vente de l'objet en main
    usage: /worth
    aliases: [prix, valeur]
  tokens:
    description: Tes jetons d'événement
    usage: /tokens [joueur]
    aliases: [jetons, token]
  historique:
    description: Historique de tes ventes (/historique <joueur> pour le staff)
    usage: /historique [joueur]
    aliases: [sellhistory, ventes, historiquevente]
  shopadmin:
    description: Administration de la boutique
    usage: /shopadmin <reload|inspect|clean>
    permission: smpshop.admin
permissions:
  smpshop.combat.bypass:
    description: Ouvrir la boutique même en combat
    default: false
  smpshop.history.others:
    description: Voir l'historique de vente des autres joueurs
    default: op
  smpshop.admin:
    description: Recharger, inspecter, donner des jetons
    default: op
