# =====================================================================
#  Prix de vente (pour UN objet).
#
#  Règle d'équilibre : plus un objet se farme en AFK, moins il vaut.
#  Objectif : environ 1 h 30 de vrai jeu (minage, Nether) = un kit PvP (~40 000 $).
#
#  ⚠ Ce serveur a les échanges villageois infinis (InstantRestock) et la string infinie
#  (StringDupersReturn) : les émeraudes sont donc gratuites (le fletcher achète la string).
#  Tout ce que vendent les villageois / le marchand ambulant a donc un prix TRÈS BAS
#  (quelques centimes) : ça se vend, mais ça ne fait pas d'argent infini.
#
#  Les objets absents de cette liste ont un prix calculé tout seul (voir auto-price dans config.yml).
#  Tous les objets ont un prix. 0 = ne se vend jamais (à éviter).   Après une modification : /shopadmin reload
# =====================================================================
