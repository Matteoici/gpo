# =====================================================================
#  SmpAdmin - panneau d'administration
#  Les textes sont dans messages.yml. Après une modification : /admin reload
# =====================================================================

# fuseau horaire des dates affichées
timezone: Europe/Paris

# ---------------------------------------------------------------- Annonces publiques
# true = tout le serveur voit "X a été banni (raison)". Ajoute -s à la commande pour une sanction discrète.
broadcast:
  ban: true
  mute: false
  kick: true
  warn: false

# ---------------------------------------------------------------- Vanish
vanish:
  # faux message de déconnexion / connexion quand on passe en vanish
  fake-messages: true
  # vision nocturne pendant le vanish
  night-vision: true
  # invincible pendant le vanish
  god: true
  # ne ramasse pas les objets au sol
  no-pickup: true

# ---------------------------------------------------------------- Freeze (vérification)
freeze:
  # bannir automatiquement un joueur qui se déconnecte pendant qu'il est gelé
  ban-on-quit: true
  ban-duration: 30d
  ban-reason: "Déconnexion pendant une vérification"
  # commandes que le joueur gelé peut encore utiliser
  allowed-commands: [msg, tell, w, r, reply, helpop]

# ---------------------------------------------------------------- Mute
mute:
  # durée quand on ne précise rien (/mute Pseudo raison)
  default-duration: 1h
  # commandes interdites quand on est muet
  blocked-commands: [msg, tell, w, r, reply, m, pm, whisper, me, say, mail, er, ereply]

# ---------------------------------------------------------------- Ban
ban:
  # durée quand on ne précise rien (/ban Pseudo raison) : perm = définitif
  default-duration: perm

# ---------------------------------------------------------------- Spectateur
spec:
  # temps passé sur chaque joueur pendant le tour automatique
  interval-seconds: 12
  # passer automatiquement en vanish pendant le /spec
  auto-vanish: true

# ---------------------------------------------------------------- Chat staff
staffchat:
  # écrire "#message" envoie directement dans le chat staff ("" pour désactiver)
  shortcut: "#"

# ---------------------------------------------------------------- Menus de sanction
# Durées proposées dans le menu (max 9). Unités : s, m, h, d (ou j), w, mo, y. "perm" = définitif.
durations: [30m, 1h, 6h, 1d, 3d, 7d, 14d, 30d, perm]

# Raisons proposées dans le menu, avec leur durée par défaut (max 9 par type)
reasons:
  ban:
    - {name: "Triche (cheat, hack)", duration: 30d, icon: DIAMOND_SWORD}
    - {name: "X-ray", duration: 14d, icon: DIAMOND_ORE}
    - {name: "Grief / vol", duration: 7d, icon: TNT}
    - {name: "Arnaque", duration: 7d, icon: GOLD_INGOT}
    - {name: "Insultes graves / menaces", duration: 3d, icon: SKELETON_SKULL}
    - {name: "Exploitation de bug", duration: 7d, icon: COMMAND_BLOCK}
    - {name: "Multi-compte / contournement", duration: perm, icon: BARRIER}
  mute:
    - {name: "Spam / flood", duration: 30m, icon: PAPER}
    - {name: "Insultes", duration: 1h, icon: SKELETON_SKULL}
    - {name: "Propos inappropriés", duration: 6h, icon: ROTTEN_FLESH}
    - {name: "Publicité", duration: 1d, icon: OAK_SIGN}
    - {name: "Provocation / toxicité", duration: 1h, icon: BLAZE_POWDER}
  kick:
    - {name: "Comportement à corriger", icon: IRON_DOOR}
    - {name: "AFK dans une zone gênante", icon: CLOCK}
    - {name: "Pseudo / skin inapproprié", icon: NAME_TAG}
  warn:
    - {name: "Langage", icon: PAPER}
    - {name: "Spam", icon: PAPER}
    - {name: "Non-respect des règles", icon: BOOK}
    - {name: "Construction gênante", icon: COBBLESTONE}
