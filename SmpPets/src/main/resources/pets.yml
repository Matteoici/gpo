# =====================================================================
#  Les familiers. Tout est modifiable, puis /pets reload.
#   nom        : nom affiché (la couleur vient de la rareté, sauf si tu mets tes propres balises)
#   rarete     : rare | epique | legendaire | mythique (voir config.yml)
#   type       : le mob (FOX, ALLAY, WITHER...) ou ITEM pour un objet qui flotte (alors "item: NETHER_STAR")
#   bebe       : version bébé · taille : 1 = normal, 0.3 = mini · variante : couleur / race (RED, SNOW, BLUE, BLACK...)
#   hauteur    : hauteur à laquelle il flotte (au-dessus des pieds du joueur) · brille : contour lumineux
#   poids      : chance relative dans sa rareté (2 = deux fois plus souvent que les autres)
#   particules : particule autour de lui (END_ROD, FLAME, SOUL, HEART...) - vide = aucune
#   icone      : objet dans les menus (par défaut l'œuf d'apparition du mob)
#   effets     : effets permanents tant qu'il est équipé : "effet:niveau" (speed:1, haste:2, night_vision:1...)
#   attributs  : "attribut:+valeur" ou "attribut:+valeur%" (max_health:+4 = +2 coeurs, movement_speed:+5%...)
#   permission : (optionnel) le familier est donné à ceux qui ont cette permission et retiré s'ils la perdent (mets alors poids: 0)
#   competence : (optionnel) compétence lancée avec /loky [joueur] - type: caca (voir Loky en bas)
#   bonus      : xp (multiplicateur d'expérience), degats-pve (multiplicateur de dégâts contre les monstres),
#                protection-pve (dégâts reçus des monstres, 0.8 = -20 %), aimant (rayon en blocs pour attirer les objets),
#                soin (PV rendus toutes les 2 s, 2 PV = 1 coeur), double-minerai (chance de doubler un minerai, 0.15 = 15 %),
#                vol-de-vie (part des dégâts faits aux monstres rendue en PV, 0.1 = 10 %)
#  Les étoiles (doublons) augmentent attributs et bonus (config.yml -> etoiles).
# =====================================================================
