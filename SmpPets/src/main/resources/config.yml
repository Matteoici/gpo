config-version: 6
# =====================================================================
#  SmpPets - familiers qui te suivent, obtenus dans des œufs
#  Joueurs :
#   /pets            -> tes familiers (clic = équiper / retirer)
#   /pets oeufs      -> les œufs, leurs chances, et les acheter (si un prix est mis)
#   /pets cacher     -> cacher / montrer tes familiers (les boosts restent)
#   /pets trade <joueur> -> échange de familiers entre deux joueurs (chacun propose, les deux valident)
#   Shift + clic sur un familier dans /pets -> il devient un objet à échanger (clic droit avec pour le récupérer)
#   /loky [joueur]   -> compétence du familier équipé (Loky, le chat des modos : il chie à la gueule du joueur visé)
#   Clic droit avec un œuf en main = l'ouvrir · accroupi + clic droit = voir ce qu'il contient
#  Admins (smppets.admin) :
#   /pets donner <joueur> <oeuf> [nombre]   -> donne des œufs (marche aussi en lot de caisse :
#        command: "pets donner %player% rare 1")
#   /pets pet <joueur> <familier>           -> donne directement un familier
#   /pets retirer <joueur> <familier>       -> lui enlève un familier
#   /pets station <oeuf>   -> en regardant un bloc : il devient une station (hologramme + œuf qui tourne).
#                            Clic dessus = voir les familiers, ouvrir (avec un œuf ou en payant), acheter.
#   /pets station retirer  -> en regardant une station
#   /pets editer <oeuf>    -> menu pour tout régler en jeu : nom, prix, apparence, description, couleur, chances
#   /pets editer familiers -> le poids de chaque familier (plus rare / plus fréquent)
#   /pets creer <id> · /pets supprimer <id>
#   /pets liste · /pets reload
#  Les familiers eux-mêmes (apparence, effets, boosts) sont dans pets.yml.
#  Doublon : un familier que tu as déjà gagne une étoile ★ (jusqu'à etoiles.max) et ses boosts augmentent.
#  Plus de familiers équipés en même temps : permissions smppets.slots.2 ... smppets.slots.5
# =====================================================================

# nombre de familiers équipés en même temps (sans permission)
emplacements: 1
# un nouveau familier est équipé tout seul s'il reste une place
equiper-auto: true
# afficher le nom du familier au-dessus de lui
nom-visible: true
# EN DANGER (SmpCombat) : ces effets / attributs / bonus des familiers sont coupés pour ne pas aider à se battre ou à fuir
coupe-en-combat:
  effets: [speed, dolphins_grace, jump_boost, resistance, fire_resistance, regeneration, strength, health_boost, absorption, slow_falling, invisibility, levitation]
  attributs: [movement_speed, max_health, armor, armor_toughness, knockback_resistance, attack_damage, attack_speed, attack_knockback, jump_strength, fall_damage_multiplier, safe_fall_distance, entity_interaction_range, block_interaction_range, scale, movement_efficiency, water_movement_efficiency, sneaking_speed, step_height, explosion_knockback_resistance, burning_time]
  bonus: [soin]

# les familiers disparaissent pendant les duels et dans les arènes de duel (les boosts restent)
cacher-en-duel: true
# particules autour des familiers : une toutes les X ticks (20 = 1 par seconde, plus grand = moins)
particules-toutes-les-ticks: 20
# ouverture d'œuf avec roulette animée (false = résultat direct)
animation: true

etoiles:
  max: 5
  # chaque étoile en plus augmente les boosts (attributs et bonus) de 25 % (les effets de potion ne changent pas)
  bonus-par-etoile: 0.15
  # quand le familier est déjà au maximum : commandes lancées par la console (%player%, %pet%) - vide = rien
  doublon-max-commandes: []

# Échange : dans /pets, Shift + clic sur un familier le transforme en objet (échangeable, vendable).
# Clic droit avec l'objet = le familier revient (s'il est déjà à toi, ses étoiles s'ajoutent).
echange:
  active: true

# ---------------------------------------------------------------------
#  Raretés
#   style   : couleur / mise en forme du nom des familiers de cette rareté
#   vitre   : couleur de la vitre dans les menus et la roulette
#   annonce : tout le serveur est prévenu quand quelqu'un en obtient un
# ---------------------------------------------------------------------
raretes:
  rare:
    nom: "<#4aa8ff><b>RARE"
    style: "<#4aa8ff>"
    couleur: "#4aa8ff"
    vitre: LIGHT_BLUE_STAINED_GLASS_PANE
    annonce: false
  epique:
    nom: "<#b34aff><b>ÉPIQUE"
    style: "<#c77dff>"
    couleur: "#b34aff"
    vitre: PURPLE_STAINED_GLASS_PANE
    annonce: false
  legendaire:
    nom: "<#ffb300><b>LÉGENDAIRE"
    style: "<#ffc93c>"
    couleur: "#ffb300"
    vitre: ORANGE_STAINED_GLASS_PANE
    annonce: true
  mythique:
    nom: "<gradient:#ffffff:#4a4a4a><b>MYTHIQUE</gradient>"
    style: "<gradient:#ffffff:#7a7a7a>"
    couleur: "#ffffff"
    vitre: BLACK_STAINED_GLASS_PANE
    annonce: true
  # familiers réservés au staff (pas dans les œufs : donnés par permission, voir "permission" dans pets.yml)
  modo:
    nom: "<#ff3b3b><b>MODO"
    style: "<#ff5c5c>"
    couleur: "#ff3b3b"
    vitre: RED_STAINED_GLASS_PANE
    annonce: false

# ---------------------------------------------------------------------
#  Œufs
#   materiau : l'objet de l'œuf
#   prix     : prix dans /pets oeufs (argent du jeu, Vault). 0 = pas en vente (caisses, events...)
#   raretes  : poids de chaque rareté (le poids est partagé entre les familiers de la rareté selon leur "poids" dans pets.yml)
#   pets     : (optionnel) liste précise {familier: poids} qui remplace "raretes"
# ---------------------------------------------------------------------
oeufs:
  rare:
    nom: "<#4aa8ff><b>Œuf Rare"
    materiau: BLUE_EGG
    rarete: rare
    prix: 25000
    lore:
      - "<gray>Un petit œuf tout bleu."
      - "<gray>Il bouge un peu..."
    raretes: {rare: 85, epique: 13, legendaire: 1.9, mythique: 0.1}
  epique:
    nom: "<#b34aff><b>Œuf Épique"
    materiau: TURTLE_EGG
    rarete: epique
    prix: 80000
    lore:
      - "<gray>Un œuf tacheté de violet."
      - "<gray>On entend quelque chose dedans."
    raretes: {rare: 35, epique: 55, legendaire: 9, mythique: 1}
  legendaire:
    nom: "<#ffb300><b>Œuf Légendaire"
    materiau: SNIFFER_EGG
    rarete: legendaire
    prix: 250000
    lore:
      - "<gray>Un œuf ancien, chaud et lourd."
      - "<gray>Ça cogne fort à l'intérieur."
    raretes: {epique: 40, legendaire: 55, mythique: 5}
  mythique:
    nom: "<gradient:#ffffff:#4a4a4a><b>Œuf Mythique</gradient>"
    materiau: DRAGON_EGG
    rarete: mythique
    prix: 750000
    lore:
      - "<gray>Personne ne sait d'où il vient."
      - "<dark_gray>Il fait trembler tes mains."
    raretes: {legendaire: 75, mythique: 25}

