name: SmpGuard
version: '${version}'
main: fr.smpguard.SmpGuard
api-version: '26.2'
softdepend: [SmpAdmin]
description: Anticheat - mods interdits (Axiom...), freecam, ESP, X-ray, combat, déplacements, tolérant au lag, relié au panneau admin
commands:
  anticheat:
    description: Panneau anticheat
    usage: /anticheat [check|alerts|bait|reset|reload]
    aliases: [ac, guard, smpguard]
    permission: smpguard.staff
permissions:
  smpguard.staff:
    description: Panneau anticheat, rapports, test appât
    default: op
  smpguard.alerts:
    description: Recevoir les alertes anticheat
    default: op
  smpguard.admin:
    description: Reset des scores, reload
    default: op
  smpguard.allow-mods:
    description: Peut utiliser les mods interdits (ex. Axiom pour construire)
    default: op
  smpguard.bypass:
    description: Jamais analysé (staff)
    default: false
  smpguard.see-all:
    description: Voit tous les joueurs même derrière les murs (staff)
    default: op
