# =====================================================================
#  SmpGuard 2.0 - anticheat (mods interdits, freecam, ESP, X-ray, combat, déplacements)
#
#  IMPORTANT : l'ESP et le freecam sont des triches d'affichage, côté client.
#  Aucun plugin ne peut les prouver à 100 %. SmpGuard :
#    1. les rend inutiles (joueurs cachés derrière les murs, voir anti-esp)
#    2. repère les comportements typiques et donne un score de confiance
#    3. donne au staff des outils pour vérifier (/anticheat bait, /spec)
#  SmpGuard ne bannit jamais tout seul : il alerte et peut marquer le joueur "suspect" dans /admin.
#  Après une modification : /anticheat reload
# =====================================================================

# ---------------------------------------------------------------- Lag
# Chaque indice est pondéré par la qualité de connexion du joueur et l'état du serveur.
# Au-delà des limites, rien n'est compté : un joueur qui lague ne peut pas être accusé.
lag:
  good-ping: 120        # en dessous : confiance pleine
  max-ping: 350         # au-dessus : rien n'est compté
  max-jitter: 120       # variation du ping (ms) au-dessus de laquelle rien n'est compté
  min-tps: 17.0         # serveur en dessous de ces TPS : rien n'est compté
  grace-seconds:        # pause après ces événements
    join: 15
    teleport: 4
    respawn: 5
    world-change: 6

# ---------------------------------------------------------------- Alertes
alerts:
  cooldown-seconds: 30
  log-to-file: true
  # marquer automatiquement le joueur comme suspect dans SmpAdmin (/sus) au seuil "sus-vl"
  smpadmin-auto-sus: true

# ---------------------------------------------------------------- Détections
checks:
  # Le joueur suit avec sa visée un joueur caché derrière des murs (typique de l'ESP).
  esp-aim:
    enabled: true
    min-distance: 6
    max-distance: 40
    angle: 3.5              # précision (degrés) ; élargie automatiquement selon le ping et la vitesse de la cible
    track-samples: 6        # échantillons consécutifs (4 par seconde) pour compter une "poursuite"
    min-target-move: 1.5    # la cible doit bouger d'au moins X blocs pendant la poursuite
    hidden-before-seconds: 1.5
    alert-vl: 3
    sus-vl: 6
    decay-per-minute: 0.15

  # Le joueur trouve des minerais rares cachés (sans grotte autour) bien plus vite qu'un mineur normal.
  xray:
    enabled: true
    max-y: 40
    window-minutes: 20
    min-veins: 4
    # nombre de blocs de pierre minés par filon "normal" (en dessous = trop chanceux)
    blocks-per-vein:
      overworld: 70
      nether: 90
    hidden-ratio: 0.6       # part des filons trouvés sans aucune ouverture naturelle
    ores:
      DIAMOND_ORE: 1.0
      DEEPSLATE_DIAMOND_ORE: 1.0
      ANCIENT_DEBRIS: 1.5
      EMERALD_ORE: 0.8
      DEEPSLATE_EMERALD_ORE: 0.8
    # PIÈGE À X-RAY : de faux diamants / débris antiques, enfermés dans la roche, envoyés au joueur seul.
    # Invisibles pour un joueur normal, visibles avec un X-ray. S'il "tombe" dessus bien plus souvent que
    # le hasard ne le permet (probabilité calculée), c'est un X-ray. Le faux redevient de la pierre dès qu'il est découvert.
    ore-bait:
      enabled: true
      max-fakes: 10
      min-distance: 6
      max-distance: 20
      lifetime-seconds: 300
      max-y: 40
      window-minutes: 30
      # découvertes minimum pour alerter
      min-found: 3
      # alerte si un mineur honnête avait moins de cette chance d'en trouver autant (0.001 = 1 sur 1000)
      max-chance: 0.001
    alert-vl: 2
    sus-vl: 4
    decay-per-minute: 0.05

  # Le joueur appuie sur les touches de déplacement mais son corps ne bouge pas (freecam, blink).
  freecam:
    enabled: true
    min-seconds: 4
    alert-vl: 3
    sus-vl: 6
    decay-per-minute: 0.1

  # Auto-totem : totem remis en seconde main plus vite qu'un humain ne peut réagir.
  # Le ping est retiré du délai mesuré (on suppose même le ping le plus bas) :
  # seules les réactions impossibles comptent. Un très bon joueur met 150 ms ou plus.
  auto-totem:
    enabled: true
    min-reaction-ms: 90
    # annule un totem remis dans le même tick que l'activation (impossible sans triche)
    block-impossible: true
    alert-vl: 2
    sus-vl: 4
    decay-per-minute: 0.05

  # ============================== NOUVEAU (2.0) ==============================

  # Mods / clients interdits, repérés dès la connexion par leurs "canaux" et le nom du client.
  # C'est la seule façon fiable d'attraper les caméras libres intégrées à un mod (ex. Axiom).
  # action : kick (expulsé tout de suite) ou alert (alerte au staff seulement).
  # Le staff avec la permission smpguard.allow-mods n'est jamais concerné.
  client:
    enabled: true
    alert-vl: 1
    sus-vl: 1
    decay-per-minute: 0
    # MODE STRICT : seuls les clients normaux entrent. Fabric / Forge / NeoForge / Quilt sont refusés à la connexion
    # (CheatUtils, Meteor, Wurst, freecams, x-ray... tournent tous dessus). Un "vanilla" qui écoute des canaux de mods
    # est un faux vanilla : refusé aussi. Le staff avec smpguard.allow-mods passe (ex. pour Axiom / WorldEdit).
    strict:
      enabled: false
      allowed-brands: ["vanilla", "*lunar*", "*badlion*", "*feather*", "*labymod*"]
      # canaux autorisés pour un client vanilla (en plus de minecraft:*)
      allowed-channels: ["bungeecord:*", "velocity:*", "voicechat:*", "worldedit:*", "lunar*:*", "badlion*:*", "feather*:*", "labymod*:*"]
      kick-unknown-brand: false
      reason: "<red><b>Client moddé refusé.</b>\n<gray>Seuls les clients normaux sont acceptés (vanilla, Lunar, Badlion, Feather, LabyMod).\n<gray>Retire Fabric / Forge pour rejoindre."
    # Sonde des mods côté client (CheatUtils...) : 25 s après la connexion, un panneau invisible s'ouvre 2 ticks.
    # Un client avec le mod "traduit" la clé (preuve) ; CheatUtils avec sa protection se déconnecte direct
    # (une fois = à surveiller, deux fois = alerte). Un joueur normal ne voit qu'un clignement.
    # Staff : /anticheat sonde <joueur>
    probe:
      enabled: true
      delay-seconds: 10
      action: kick
      reason: "<red><b>Client de triche détecté.</b>\n<gray>Rejoins avec un client normal."
      # 4 clés max par sonde ; une clé inconnue ne peut jamais donner de faux positif
      keys:
        - {key: "key.category.cheatutils.common", mod: "CheatUtils"}
        - {key: "key.meteor-client.open-gui", mod: "Meteor Client"}
        - {key: "key.wurst.zoom", mod: "Wurst"}
        - {key: "key.freecam.toggle", mod: "Freecam"}
    rules:
      - name: "Axiom (caméra libre / noclip)"
        channels: ["axiom:*"]
        action: kick
        reason: "<red><b>Axiom n'est pas autorisé sur ce serveur.</b>\n<gray>Sa caméra libre permet de voir à travers les murs.\n<gray>Retire le mod pour rejoindre."
      - name: "Client de triche"
        brands: ["*meteor*", "*wurst*", "*aristois*", "*liquidbounce*", "*impact*", "*future*", "*rusherhack*", "*thunderhack*",
                 "*bleachhack*", "*konas*", "*salhack*", "*inertia*", "*lambda*", "*kami*", "*phobos*", "*boze*", "*3arthh4ck*",
                 "*coffee*", "*vape*", "*novoline*", "*sigma*", "*prestige*", "*doomsday*", "*argon*"]
        channels: ["meteor*:*", "wurst*:*", "liquidbounce*:*", "aristois*:*", "rusherhack*:*", "thunderhack*:*", "bleachhack*:*"]
        action: kick
        reason: "<red><b>Client de triche détecté.</b>\n<gray>Rejoins avec un client normal."
      - name: "Freecam (mod)"
        channels: ["freecam*:*", "*freecam*"]
        action: kick
        reason: "<red><b>Le mod Freecam n'est pas autorisé sur ce serveur.</b>"
      - name: "Baritone (bot de minage)"
        channels: ["baritone:*"]
        action: alert

  # Ouvre un coffre / casse un bloc qu'il ne peut PAS voir depuis ses yeux (mur plein entre les deux).
  # C'est la signature d'une caméra libre (son corps est ailleurs que sa caméra) ou d'un ESP de coffres.
  wall-interact:
    enabled: true
    # annule l'ouverture d'un coffre invisible (le pillage en freecam devient impossible)
    cancel-containers: true
    # annule le cassage d'un bloc invisible
    cancel-breaks: true
    points-container: 1.0
    points-break: 0.5
    # ouvre un coffre visible mais en regardant à plus de X° de lui (caméra ailleurs que la tête)
    max-angle: 80
    alert-vl: 2
    sus-vl: 4
    decay-per-minute: 0.1

  # Frappe plus loin que la portée du jeu (3 blocs). Le lag de la cible est entièrement pris en compte.
  reach:
    enabled: true
    margin: 0.4
    # annule les coups au-delà de portée + cancel-above (triche évidente)
    cancel: true
    cancel-above: 1.2
    alert-vl: 3
    sus-vl: 6
    decay-per-minute: 0.2

  # Killaura : frappe hors de son champ de vision, à travers un mur, ou deux cibles opposées dans le même tick.
  killaura:
    enabled: true
    max-angle: 65
    multi-angle: 70
    alert-vl: 3
    sus-vl: 6
    decay-per-minute: 0.15

  # Autoclicker : plus de max-cps clics par seconde pendant "seconds" secondes (en l'air ou sur une entité, pas en minant).
  autoclicker:
    enabled: true
    max-cps: 20
    seconds: 3
    alert-vl: 2
    sus-vl: 4
    decay-per-minute: 0.1

  # Fly : en l'air plus d'1,5 s sans tomber, ou monte plus haut qu'un saut sans rien pour le porter.
  fly:
    enabled: true
    # pause après un coup / une explosion / une charge de vent / un rebond
    push-grace-ms: 2500
    alert-vl: 3
    sus-vl: 6
    decay-per-minute: 0.2

  # Speed : plus rapide que le maximum possible (effets, bonus, glace pris en compte).
  speed:
    enabled: true
    # vitesse max normale (sprint + sauts) en blocs par seconde, avant bonus
    max-blocks-per-second: 7.9
    alert-vl: 3
    sus-vl: 6
    decay-per-minute: 0.2

  # NoFall : prétend toucher le sol en tombant dans le vide (pour annuler les dégâts de chute).
  nofall:
    enabled: true
    alert-vl: 3
    sus-vl: 6
    decay-per-minute: 0.15

  # FastBreak / Nuker : casse plus vite que le jeu ne le permet, trop de blocs par seconde, ou derrière lui.
  fastbreak:
    enabled: true
    # cassé en moins de X fois le temps normal
    min-ratio: 0.7
    max-per-second: 9
    max-angle: 90
    cancel: true
    alert-vl: 3
    sus-vl: 6
    decay-per-minute: 0.15

  # InvMove : marche avec un coffre / menu ouvert (impossible avec le jeu normal)
  inventory-move:
    enabled: true

  # Criticals : coups critiques sans vraie chute (faux sauts envoyés au serveur)
  criticals:
    enabled: true

  # Scaffold / AirPlace : bloc posé contre du vide (annulé), en regardant ailleurs, ou trop vite
  scaffold:
    enabled: true
    max-angle: 110
    max-per-second: 14

# ---------------------------------------------------------------- Protection anti-ESP
# Cache les joueurs qui ne sont pas visibles (derrière un mur) : l'ESP et le freecam
# ne peuvent plus les voir, puisque le client ne reçoit même pas leur position.
# ⚠ Un joueur caché disparaît aussi de la liste TAB de celui qui ne le voit pas,
#   et on n'entend plus ses pas à travers les murs. Désactivé par défaut : teste avant.
anti-esp:
  hide-players-behind-walls: false
  distance: 48
  # nombre maximum de lancers de rayons par tick (protège les performances)
  budget-per-tick: 400

# ---------------------------------------------------------------- Vie des joueurs cachée
# Les mods "health indicator" lisent la vie exacte que le serveur envoie pour chaque joueur.
# Activé : chaque joueur ne reçoit plus que SA vie ; celle des autres paraît toujours pleine.
# Nécessite ProtocolLib. Le staff avec smpguard.see-health voit la vraie vie.
hide-health:
  enabled: true

# ---------------------------------------------------------------- Test appât (/anticheat bait)
# Un faux joueur, visible UNIQUEMENT par le suspect, se déplace dans la roche autour de lui.
# Un joueur normal ne peut pas le voir ; avec un ESP, il le voit à travers les murs.
bait:
  default-seconds: 30
  radius: 12
