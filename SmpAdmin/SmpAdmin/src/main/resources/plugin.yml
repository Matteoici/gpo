name: SmpAdmin
version: '${version}'
main: fr.smpadmin.SmpAdmin
api-version: '26.2'
description: Panneau d'administration (vanish, sanctions, freeze, suspects, spectateur)
commands:
  admin:
    description: Ouvrir le panneau d'administration
    usage: /admin [joueur|reload]
    aliases: [panel, ap, staffpanel]
    permission: smpadmin.panel
  vanish:
    description: Devenir invisible
    usage: /vanish [joueur]
    aliases: [v]
    permission: smpadmin.vanish
  ban:
    description: Bannir un joueur
    usage: /ban <joueur> [durée] [raison] [-s]
    aliases: [tempban, tban]
    permission: smpadmin.ban
  unban:
    description: Débannir un joueur
    usage: /unban <joueur>
    aliases: [pardon]
    permission: smpadmin.unban
  banlist:
    description: Liste des bannis
    aliases: [bans]
    permission: smpadmin.ban
  mute:
    description: Rendre un joueur muet
    usage: /mute <joueur> [durée] [raison] [-s]
    aliases: [tempmute]
    permission: smpadmin.mute
  unmute:
    description: Rendre la parole à un joueur
    usage: /unmute <joueur>
    permission: smpadmin.mute
  kick:
    description: Expulser un joueur
    usage: /kick <joueur> [raison] [-s]
    permission: smpadmin.kick
  warn:
    description: Avertir un joueur
    usage: /warn <joueur> [raison]
    aliases: [avertir]
    permission: smpadmin.warn
  history:
    description: Historique des sanctions d'un joueur
    usage: /history <joueur>
    aliases: [hist, sanctions, casier]
    permission: smpadmin.history
  freeze:
    description: Geler un joueur (vérification)
    usage: /freeze <joueur>
    aliases: [gel, ss]
    permission: smpadmin.freeze
  sus:
    description: Marquer un joueur comme suspect
    usage: /sus <joueur> [raison] | /sus list | /sus remove <joueur>
    aliases: [suspect]
    permission: smpadmin.sus
  spec:
    description: Spectateur (tour automatique de tous les joueurs)
    usage: /spec [joueur|next|prev|stop]
    aliases: [spectate, watch]
    permission: smpadmin.spec
  invsee:
    description: Voir l'inventaire d'un joueur
    usage: /invsee <joueur>
    permission: smpadmin.invsee
  ecsee:
    description: Voir le coffre de l'Ender d'un joueur
    usage: /ecsee <joueur>
    aliases: [endersee]
    permission: smpadmin.invsee
  staffchat:
    description: Chat du staff
    usage: /sc [message]
    aliases: [sc]
    permission: smpadmin.staffchat
  clearchat:
    description: Nettoyer le chat
    aliases: [cc]
    permission: smpadmin.chat
  chatlock:
    description: Bloquer / débloquer le chat
    aliases: [lockchat, mutechat]
    permission: smpadmin.chat
permissions:
  smpadmin.*:
    description: Tout SmpAdmin
    default: op
    children:
      smpadmin.panel: true
      smpadmin.vanish: true
      smpadmin.vanish.see: true
      smpadmin.vanish.others: true
      smpadmin.ban: true
      smpadmin.ban.perm: true
      smpadmin.unban: true
      smpadmin.mute: true
      smpadmin.kick: true
      smpadmin.warn: true
      smpadmin.history: true
      smpadmin.freeze: true
      smpadmin.sus: true
      smpadmin.spec: true
      smpadmin.invsee: true
      smpadmin.invsee.modify: true
      smpadmin.staffchat: true
      smpadmin.chat: true
      smpadmin.alerts: true
      smpadmin.exempt: true
      smpadmin.reload: true
  smpadmin.panel: {default: op, description: "Ouvrir /admin"}
  smpadmin.vanish: {default: op, description: "Se mettre en vanish"}
  smpadmin.vanish.see: {default: op, description: "Voir les joueurs en vanish"}
  smpadmin.vanish.others: {default: op, description: "Mettre un autre joueur en vanish"}
  smpadmin.ban: {default: op, description: "Bannir temporairement"}
  smpadmin.ban.perm: {default: op, description: "Bannir définitivement"}
  smpadmin.unban: {default: op, description: "Débannir"}
  smpadmin.mute: {default: op, description: "Mute / unmute"}
  smpadmin.kick: {default: op, description: "Expulser"}
  smpadmin.warn: {default: op, description: "Avertir"}
  smpadmin.history: {default: op, description: "Voir l'historique des sanctions"}
  smpadmin.freeze: {default: op, description: "Geler un joueur"}
  smpadmin.sus: {default: op, description: "Gérer les suspects"}
  smpadmin.spec: {default: op, description: "Mode spectateur"}
  smpadmin.spec.exempt: {default: false, description: "N'apparaît pas dans le tour du /spec"}
  smpadmin.invsee: {default: op, description: "Voir les inventaires"}
  smpadmin.invsee.modify: {default: op, description: "Modifier les inventaires vus"}
  smpadmin.staffchat: {default: op, description: "Chat staff"}
  smpadmin.chat: {default: op, description: "Clear chat / lock chat"}
  smpadmin.chat.bypass: {default: op, description: "Parler quand le chat est bloqué"}
  smpadmin.alerts: {default: op, description: "Recevoir les alertes staff"}
  smpadmin.exempt: {default: op, description: "Ne peut pas être sanctionné"}
  smpadmin.reload: {default: op, description: "Recharger la config"}
