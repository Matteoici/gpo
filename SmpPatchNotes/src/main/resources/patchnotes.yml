        <dark_red><b>⛧ Projet Capricorne</b>
        <black>Un fragment de l'IA renégate qui vit derrière le <dark_red>Black Wall</dark_red>.

        <dark_red>Prestige<black>, chez le Roi ET chez la Reine. La plus forte du serveur.

        <dark_gray>Titre : Au-delà du Black Wall
