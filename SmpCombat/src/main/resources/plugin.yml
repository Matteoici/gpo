name: SmpCombat
version: '${version}'
main: fr.smpcombat.SmpCombat
api-version: '26.2'
description: "Combat façon Deepwoken : EN DANGER, pas de téléportation ni de boutique, se déconnecter = mourir"
commands:
  combat:
    description: "Ton état de combat (staff : /combat clear <joueur>, /combat reload)"
    usage: /combat [clear <joueur>|reload]
    aliases: [danger, ct]
  mb:
    description: "My bad : enlève le combat causé en tapant un ami, ta guilde ou un allié"
    usage: /mb all  ou  /mb <joueur>
    aliases: [mybad, pardon]
permissions:
  smpcombat.bypass:
    description: Jamais "en danger" (staff)
    default: false
  smpcombat.admin:
    description: /combat clear et reload
    default: op
