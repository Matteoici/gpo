# ---------------------------------------------------------------- 🏆 CLASSEMENTS DE LA SEMAINE
# remis à zéro chaque semaine ; les 3 premiers de chaque classement reçoivent leurs récompenses
weekly:
  reset-day: MONDAY
  reset-hour: 0
  boards:
    saison:
      name: "<gold>🎫 XP de saison"
      icon: EXPERIENCE_BOTTLE
      rewards:
        1: ["money:150000", "caisse cle %player% mythique 1"]
        2: ["money:80000", "caisse cle %player% legendaire 1"]
        3: ["money:40000", "caisse cle %player% epique 1"]
    metiers:
      name: "<#9be36b>🛠 XP de métiers"
      icon: IRON_PICKAXE
      rewards:
        1: ["money:100000", "caisse cle %player% legendaire 1"]
        2: ["money:60000", "caisse cle %player% epique 1"]
        3: ["money:30000", "caisse cle %player% rare 1"]
    kills:
