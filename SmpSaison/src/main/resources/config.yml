# =====================================================================
#  SmpSaison - métiers, passe de saison, classements de la semaine
#  /metiers   /passe   /hebdo      admin : /saison xp|premium|info|reset|hebdo-reset|reload
#  Récompenses = liste de commandes lancées par la console (%player% = le joueur)
#    "money:5000"                          -> argent (Vault)
#    "caisse cle %player% rare 1"           -> clé de caisse (SmpCrates)
#    "boss give %player% pioche3x3"         -> objet de boss (SmpBoss)
#  Un joueur hors ligne reçoit ses récompenses à sa prochaine connexion.
# =====================================================================
config-version: 3
money-symbol: "$"
timezone: "Europe/Paris"

# ---------------------------------------------------------------- 🛠 MÉTIERS
# chaque action donne de l'XP de métier et de l'argent ; l'argent monte de +2 % par niveau
# XP pour passer du niveau N au niveau N+1 = xp-base x N^xp-exposant
jobs-settings:
  max-level: 50
  xp-base: 100
  xp-exponent: 1.55
  money-bonus-per-level: 0.02
  # bonus du métier : % de chance par niveau (niveau 50 x 0.6 = 30 %)
  bonus-per-level: 0.6
  # mobs sortis d'un spawner : gains x0.2
  spawner-ratio: 0.2
  # petit résumé des gains au-dessus de la barre d'objets
  actionbar: true
  # PRESTIGE : au niveau max, clic sur le métier dans /metiers -> retour au niveau 1 avec un bonus permanent
  prestige:
    max: 5
    money: 0.10          # +10 % d'argent par prestige
    bonus-chance: 2      # +2 % de bonus (objets en double) par prestige
    season-xp: 1000
    rewards: ["money:100000"]

