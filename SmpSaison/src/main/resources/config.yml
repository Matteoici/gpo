  ends: "2026-12-31"
  xp-per-tier: 1000
  # le premium s'achète avec l'argent du jeu (/passe premium) ; permission smpsaison.premium = offert
  premium-price: 5000000
  # avec le premium : +25 % d'XP de saison (on monte plus vite)
  premium-xp-bonus: 1.25
  # d'où vient l'XP de saison
  xp:
    job-ratio: 0.5          # 50 % de l'XP de métier
    player-kill: 40
    mob-kill: 1
    playtime-10min: 25      # toutes les 10 min jouées (pas AFK)
