# =====================================================================
#  SmpSandevistan - le temps s'arrête dans un rayon autour de toi, toi tu bouges
#
#  /sandevistan [secondes]   active (ou coupe s'il est déjà actif)
#  /sandevistan item         donne l'implant (clic droit = activer / couper)
#  /sandevistan reload
#  Permission : smpsandevistan.use (op par défaut)
#
#  Pendant l'effet :
#   - tout est figé dans le rayon : joueurs (même la caméra), monstres, flèches, TNT, objets...
#   - toi : Vitesse, coups sans recharge, images rémanentes, traînée de couleurs
#   - touche F : dash (tu traverses l'espace, des images tout le long)
#   - clic près d'une flèche / boule de feu figée : elle repartira vers son tireur
#   - tes coups sont "en attente" (compteur au-dessus de la cible) et tombent en cascade quand le temps reprend
# =====================================================================

config-version: 4

radius: 100
duration-seconds: 10
max-duration-seconds: 60
cooldown-seconds: 20

# bonus pendant l'effet
speed-level: 3            # Vitesse III
no-attack-cooldown: true  # tu frappes à toute vitesse
# les joueurs figés ne peuvent même plus tourner la tête
freeze-camera: true

# couleurs du Sandevistan (hexadécimal) : vert néon comme dans Edgerunners
palette: ["#00ff9c", "#39ff14", "#00e676", "#b2ff59"]

# tout ce qui est figé (monstres, flèches, objets...) a un contour vert
frozen-glow: true

screen:
  title: true             # "SANDEVISTAN" qui glitch au démarrage
  bossbar: true           # temps restant
  green-haze: true        # brume verte sur les bords de ta vue (jamais au centre)
  green-haze-density: 6
  tint: false             # bords de l'écran teintés (ROUGE : limite du jeu, désactivé pour rester vert)
  tint-strength: 0.45     # 0.05 à 0.95
  freeze-sky: true        # le soleil / les nuages s'arrêtent aussi
  wave-radius: 40         # onde de choc au démarrage

afterimages:
  enabled: true
  copies: true                 # copies de toi (ton skin) avec un contour vert
  particle-silhouettes: true   # silhouettes vertes en particules (marchent partout, même au spawn protégé)
  persist: true                # comme dans l'anime : les copies restent jusqu'à ce que tu coupes l'effet
  min-distance: 1.2            # une copie tous les X blocs parcourus
  every-ticks: 2
  life-ticks: 14               # temps pour passer du vert clair au vert foncé (et durée de vie si persist: false)
  max: 150                     # copies en même temps (au-delà, la plus ancienne part)
  particle-silhouettes-max: 24 # silhouettes en particules (les plus récentes)
  hide-closer-than: 3.0        # tu ne vois pas tes images / silhouettes à moins de X blocs devant toi
  # couleur du contour selon l'âge de la copie (noms Minecraft : green, dark_green, aqua...)
  glow-colors: [green, green, dark_green]

dash:
  enabled: true
  distance: 9
  cooldown-ms: 500

deflect:
  enabled: true
  reach: 4

hits:
  counter: true           # "x5 12.5 ❤" au-dessus de la cible
  max-frozen-sparks: 80   # étincelles suspendues dans l'air

# contrecoup après l'effet (proportionnel à la durée utilisée)
aftermath:
  enabled: true
  slowness-seconds: 2
  nausea-seconds: 3

messages:
  prefix: "<dark_green>[<gradient:#b2ff59:#00ff9c>Sandevistan</gradient>]</dark_green> "
  on: "<green>Le temps s'arrête : <white><n></white> entité(s) figée(s) dans <white><r></white> blocs."
  off: "<green>Le temps reprend. <white><hits></white> coup(s) libéré(s)."
  cooldown: "<red>Implant en surchauffe : encore <white><s></white> s."
  item: "<green>Implant Sandevistan donné."
  reload: "<green>Config rechargée."
