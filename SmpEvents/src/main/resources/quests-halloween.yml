# =====================================================================
#  🎃 Quêtes d'HALLOWEEN : données EN PLUS des quêtes normales pendant l'événement
#  (combien par jour / par semaine et jusqu'à quand : quests.events.halloween dans config.yml)
#  Même format que quests.yml. BOSS_DAMAGE / BOSS_WIN = combat contre un boss de SmpBoss :
#  targets [ROI] = Roi Citrouille, [REINE] = Reine Araignée, [] = les deux.
#  Après une modification : /smpevents reload
# =====================================================================
# (ne pas toucher : sert à ajouter les nouvelles quêtes aux fichiers déjà installés)
