# =====================================================================
#  Liste des quêtes. Chaque jour, chaque joueur en reçoit au hasard
#  (nombre par difficulté : quests.daily-slots dans config.yml).
#
#  type : MINE, HARVEST, PLACE, KILL_MOB, KILL_PLAYER, FISH, SMELT, BREED,
#         ENCHANT, VILLAGER_TRADE, EAT, WALK, PLAYTIME (minutes), KOTH_TIME (secondes), BOUNTY
#  targets : blocs / créatures / objets acceptés (noms Minecraft en anglais). Vide = tout.
#  reward : argent (multiplié par quests.rewards-multiplier)
#  commands : commandes en plus, lancées par la console (%player%)
#  name : texte affiché, <amount> = la quantité
#  Après une modification : /smpevents reload
# =====================================================================

