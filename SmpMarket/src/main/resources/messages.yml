# ---------------------------------------------------------------- Panneaux flottants
sign:
  rented:
    - "<gradient:#ffd36b:#ff8a3d><b>🏪 <shop></b></gradient>"
    - "<gray>tenue par <white><owner>"
    - "<yellow><count></yellow> <gray>article(s) en vente"
    - "<dark_gray>Clic droit : catalogue"
  renewal: "<red>⚑ Enchère en cours : <gold><bid></gold> <gray>(<time>)"
  # panneau d'un stand loué : <name> = nom avec la couleur, le fond et le symbole choisis par le locataire
  styled:
    - "<name>"
    - "<gray>tenue par <white><owner>"
    - "<yellow><count></yellow> <gray>article(s) en vente"
    - "<dark_gray>Clic droit : catalogue"
  styled-slogan:
    - "<name>"
    - "<slogan>"
    - "<gray>tenue par <white><owner></white> <dark_gray>·</dark_gray> <yellow><count></yellow> <gray>article(s)"
    - "<dark_gray>Clic droit : catalogue"
  slogan: "<white><i>« <slogan> »"
  free:
    - "<green><b>★ STAND À LOUER ★</b></green>"
    - "<gray>Stand <white><stall></white> <dark_gray>(<size>)"
    - "<bid-line>"
    - "<time-line>"
    - "<yellow>Clic droit pour enchérir"
  free-start: "<gray>Mise à prix : <gold><bid>"
  free-bid: "<gray>Meilleure offre : <gold><bid></gold> <gray>par <white><bidder>"
  free-time: "<gray>Fin dans <white><time>"
  free-waiting: "<dark_gray>En attente de la première offre"

showcase-label:
  # étiquettes au-dessus des vitrines (courtes pour ne pas se chevaucher). <price> prend la couleur du stand.
  v2:
    in-stock:
      - "<white><item>"
      - "<price>"
      - "<gray>x<stock>"
    out-of-stock:
      - "<gray><item>"
      - "<red><b>ÉPUISÉ"
  in-stock:
    - "<white><item>"
    - "<gold><b><price></b> <gray>/ pièce"
    - "<gray>Stock : <white><stock>"
  out-of-stock:
    - "<white><item>"
    - "<gold><price> <gray>/ pièce"
    - "<red><b>RUPTURE DE STOCK"

