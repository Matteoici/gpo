  auto-renewed: "<green>Stand <white><shop></white> renouvelé automatiquement pour <gold><amount></gold>. <gray><white><time></white> restants."
  lost-stall: "<red>Ton stand <white><shop></white> a été repris par <white><player></white>. <gray>Tes objets t'attendent dans <aqua>/marche colis</aqua>."
  expired: "<red>Ta location du stand <white><shop></white> est terminée. <gray>Tes objets t'attendent dans <aqua>/marche colis</aqua>."
  cancelled: "<yellow>L'enchère sur <white><shop></white> a été annulée par un administrateur. <gold><amount></gold> <gray>t'ont été rendus."

# ---------------------------------------------------------------- Vitrines
