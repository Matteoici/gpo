  already: "<red>Il y a déjà une vitrine sur ce bloc."
  limit: "<red>Ton stand ne peut avoir que <white><max></white> vitrines."
  no-space: "<red>Il faut un espace libre au-dessus du bloc, à l'intérieur du stand."
