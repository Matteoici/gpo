  extended: "<yellow>Offre de dernière minute : l'enchère est prolongée de <white><time></white>."
  started: "<gold><b>🔨</b></gold> <white><player></white> <gray>a lancé l'enchère du stand <white><stall></white> <dark_gray>(<size>)</dark_gray> à <gold><amount></gold>. <gray>Fin dans <white><time></white>. <aqua>/marche encheres"
