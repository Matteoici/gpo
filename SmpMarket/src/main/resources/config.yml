config-version: 2
# =====================================================================
#  SmpMarket - marché de joueurs (stands loués aux enchères + vitrines)
#  Les textes sont dans messages.yml. Après une modification : /marche admin reload
# =====================================================================

currency-symbol: "$"

# ---------------------------------------------------------------- Location des stands
lease:
  # durée d'une location gagnée aux enchères (jours)
  days: 7
  # l'enchère pour la location suivante s'ouvre X heures avant la fin de la location
  renew-window-hours: 24
  # nombre maximum de stands par joueur (en comptant les enchères où il est en tête)
  max-per-player: 1
  # un stand acheté qui n'expose AUCUN objet et n'a pas été modifié pendant X heures
  # est remboursé à son acheteur et remis aux enchères (0 = jamais).
  # Un stand avec au moins une vitrine (même en rupture de stock) n'est jamais repris.
  inactive-hours: 24

# ---------------------------------------------------------------- Enchères
auction:
  # durée d'une enchère sur un stand libre, à partir de la première offre (heures)
  duration-hours: 2
  # surenchère minimale : le plus grand des deux
  min-increment: 100
  min-increment-percent: 5
  # une offre dans les X dernières minutes prolonge l'enchère de X minutes (anti-dernière seconde)
  anti-snipe-minutes: 5

# ---------------------------------------------------------------- Vitrines et ventes
shop:
  # taxe prélevée sur chaque vente (en %), l'argent disparaît (bon pour l'économie)
  tax-percent: 5
  # impôt progressif : une vente d'au moins X paie Y % (le plus haut palier atteint s'applique)
  tax-brackets:
    "1000000": 7
    "10000000": 10
  # nombre de vitrines par stand (peut être changé stand par stand : /marche admin showcases <stand> <n>)
  default-showcases: 6
  # stock maximum par vitrine (en objets)
  max-stock: 3456
  # distance maximale pour acheter depuis le catalogue d'un stand
  buy-distance: 12
  # prix minimum et maximum par objet
  min-price: 1
  max-price: 100000000

# ---------------------------------------------------------------- Protection
protection:
  # seul le locataire (et ses amis) peut construire / casser / ouvrir les coffres dans son stand
  protect-stalls: true
  # le locataire peut rendre son stand privé (personne n'entre à part lui et ses amis)
  allow-private-stalls: true
  # autorise le locataire à construire dans son stand même si le spawn est protégé (WorldGuard, spawn-protection...)
  override-other-protections: true

# ---------------------------------------------------------------- Visuels
visuals:
  # hauteur du panneau flottant au-dessus du point d'entrée du stand
  sign-height: 2.6
  # taille des objets exposés
  item-scale: 0.55
  # les objets exposés tournent sur eux-mêmes
  spin: true
  # étiquettes au-dessus des vitrines
  label-scale: 0.5
  # largeur max d'une ligne (les noms longs passent à la ligne au lieu de déborder sur la vitrine d'à côté)
  label-width: 70
  # une étiquette sur deux un peu plus haut (vitrines collées)
  label-stagger: true
  # prix courts : 1M $ au lieu de 1 000 000 $
  label-short-prices: true

# ---------------------------------------------------------------- Améliorations achetables par le locataire
# (valables pour la location en cours, remises à zéro quand le stand change de main)
upgrades:
  showcase:
    # prix de la 1re vitrine en plus, puis × price-growth à chaque achat
    base-price: 25000
    price-growth: 1.5
    max-extra: 12
  catalog:
    # objets en vente SANS vitrine (dans le catalogue du stand)
    base-price: 15000
    price-growth: 1.4
    max-slots: 21

# Mannequin du locataire (son skin) quand il n'est pas dans son stand
mannequins:
  enabled: true
  # le mannequin apparaît quand le locataire est déconnecté ou à plus de X blocs de son stand
  owner-distance: 100

# ---------------------------------------------------------------- Personnalisation des stands (par le locataire)
# Menu : /marche -> Ma boutique -> Personnaliser
customization:
  # couleur du nom (MiniMessage). Le nom du joueur est ajouté à la fin.
  themes:
    or: {name: "Or", icon: YELLOW_DYE, format: "<gradient:#ffd36b:#ff8a3d>"}
    feu: {name: "Feu", icon: ORANGE_DYE, format: "<gradient:#ff4b1f:#ff9068>"}
    rubis: {name: "Rubis", icon: RED_DYE, format: "<gradient:#ff416c:#ff4b2b>"}
    rose: {name: "Rose", icon: PINK_DYE, format: "<gradient:#ff9a9e:#fecfef>"}
    violet: {name: "Améthyste", icon: PURPLE_DYE, format: "<gradient:#a18cd1:#fbc2eb>"}
    magie: {name: "Magie", icon: MAGENTA_DYE, format: "<gradient:#c471f5:#fa71cd>"}
    ocean: {name: "Océan", icon: BLUE_DYE, format: "<gradient:#2193b0:#6dd5ed>"}
    glace: {name: "Glace", icon: LIGHT_BLUE_DYE, format: "<gradient:#a1c4fd:#c2e9fb>"}
    cyan: {name: "Turquoise", icon: CYAN_DYE, format: "<gradient:#00c9ff:#92fe9d>"}
    emeraude: {name: "Émeraude", icon: LIME_DYE, format: "<gradient:#3cff9a:#00b36b>"}
    foret: {name: "Forêt", icon: GREEN_DYE, format: "<gradient:#56ab2f:#a8e063>"}
    neige: {name: "Neige", icon: WHITE_DYE, format: "<white>"}
    ombre: {name: "Ombre", icon: GRAY_DYE, format: "<gradient:#bdc3c7:#6c7a89>"}
    arcenciel: {name: "Arc-en-ciel", icon: GLOW_INK_SAC, format: "<rainbow>"}
  # fond du panneau et des étiquettes (opacity : 0 = transparent, 255 = opaque)
  backgrounds:
    sombre: {name: "Sombre", icon: BLACK_STAINED_GLASS_PANE, color: "#0a0a14", opacity: 150}
    transparent: {name: "Transparent", icon: GLASS_PANE, color: "#000000", opacity: 0}
    nuit: {name: "Bleu nuit", icon: BLUE_STAINED_GLASS_PANE, color: "#0b1d3a", opacity: 170}
    bordeaux: {name: "Bordeaux", icon: RED_STAINED_GLASS_PANE, color: "#3a0b12", opacity: 170}
    sapin: {name: "Sapin", icon: GREEN_STAINED_GLASS_PANE, color: "#0b2a17", opacity: 170}
    prune: {name: "Prune", icon: PURPLE_STAINED_GLASS_PANE, color: "#26103a", opacity: 170}
    ambre: {name: "Ambre", icon: ORANGE_STAINED_GLASS_PANE, color: "#3a250b", opacity: 170}
  # symboles devant le nom ("aucun" = rien)
  symbols: ["aucun", "★", "✦", "♛", "⚔", "⛏", "✿"]
