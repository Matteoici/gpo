# =====================================================================
#  SmpGuilds - configuration
#  Tous les textes sont dans messages.yml (format MiniMessage).
#  Après une modification : /guild admin reload
# =====================================================================

# Sauvegarde automatique (minutes). Tout est aussi sauvegardé à l'arrêt du serveur.
autosave-minutes: 5

# ---------------------------------------------------------------- Guilde
guild:
  name-regex: "^[A-Za-z0-9_]{3,16}$"
  tag-regex: "^[A-Za-z0-9]{2,5}$"
  description-max-length: 80
  # mots interdits dans les noms et les tags (insensible à la casse)
  blacklist: [admin, staff, modo, owner, console]
  # coûts payés par le joueur (Vault). 0 = gratuit
  create-cost: 5000
  rename-cost: 2500
  # couleur par défaut du tag : black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple,
  # gold, gray, dark_gray, blue, green, aqua, red, light_purple, yellow, white
  default-color: gold
  # recrutement ouvert à la création (n'importe qui peut rejoindre sans invitation)
  default-open: false
  max-allies: 3
  # dégâts entre membres / entre alliés
  friendly-fire: false
  ally-friendly-fire: false
  invite-expire-seconds: 120
  # annoncer à tout le serveur la création / dissolution d'une guilde
  broadcast-create: true
  broadcast-disband: true
  # nombre d'entrées gardées dans le journal de chaque guilde
  log-size: 60

# ---------------------------------------------------------------- Rangs
# Le chef a toujours toutes les permissions.
# Permissions possibles : INVITE, KICK, PROMOTE, APPLICATIONS, CLAIM, UNCLAIM, SETHOME, HOME,
# BANK_DEPOSIT, BANK_WITHDRAW, VAULT, BUILD, EDIT, ALLY, WAR, LOG
roles:
  recruit: [HOME, BUILD, BANK_DEPOSIT]
  member: [HOME, BUILD, BANK_DEPOSIT, VAULT, LOG]
  officer: [HOME, BUILD, BANK_DEPOSIT, VAULT, LOG, INVITE, KICK, PROMOTE, APPLICATIONS,
            CLAIM, UNCLAIM, SETHOME, BANK_WITHDRAW, ALLY]

# ---------------------------------------------------------------- Home
home:
  warmup-seconds: 5
  cooldown-seconds: 30
  # le home doit être placé dans un terrain de la guilde
  must-be-in-claim: true

# ---------------------------------------------------------------- Terrains
claims:
  # prix d'un chunk, payé par la trésorerie de la guilde
  cost: 500
  # les terrains doivent se toucher (sauf le premier)
  must-connect: true
  # nombre de chunks libres obligatoires entre deux guildes
  buffer-chunks: 1
  # mondes où on ne peut pas claim
  disabled-worlds: [world_nether, world_the_end]
  # rayon (en blocs) autour du spawn du monde où on ne peut pas claim
  spawn-protection-radius: 150
  # empêcher les explosions (creepers, TNT...) dans les terrains
  block-explosions: true
  # protéger les animaux et les cadres dans les terrains
  protect-animals: true
  allies-can-build: false
  # notification en entrant dans un terrain : title, actionbar ou none
  enter-notification: title
  # entretien quotidien : la trésorerie paie X par chunk et par jour, sinon la guilde perd des terrains
  upkeep:
    enabled: false
    per-claim-per-day: 20

# ---------------------------------------------------------------- XP et niveaux
xp:
  # kill d'un joueur d'une autre guilde (pas un allié)
  player-kill: 10
  # kill d'un monstre
  mob-kill: 1
  # bonus pendant une guerre
  war-kill: 25
  war-win: 500
  # anti-farm : pas d'XP si on retue la même personne avant ce délai
  kill-cooldown-minutes: 10

# xp = XP totale nécessaire pour atteindre le niveau
# effects = bonus permanents dans les terrains de la guilde (TYPE:niveau, 0 = niveau I)
levels:
  1:  {xp: 0,     max-members: 5,  max-claims: 4,  vault-rows: 1, effects: []}
  2:  {xp: 500,   max-members: 7,  max-claims: 8,  vault-rows: 1, effects: []}
  3:  {xp: 1500,  max-members: 9,  max-claims: 12, vault-rows: 2, effects: []}
  4:  {xp: 3500,  max-members: 12, max-claims: 18, vault-rows: 2, effects: ["SPEED:0"]}
  5:  {xp: 7000,  max-members: 15, max-claims: 25, vault-rows: 3, effects: ["SPEED:0", "HASTE:0"]}
  6:  {xp: 12000, max-members: 18, max-claims: 32, vault-rows: 3, effects: ["SPEED:0", "HASTE:0"]}
  7:  {xp: 20000, max-members: 22, max-claims: 40, vault-rows: 4, effects: ["SPEED:0", "HASTE:0", "NIGHT_VISION:0"]}
  8:  {xp: 32000, max-members: 26, max-claims: 50, vault-rows: 4, effects: ["SPEED:0", "HASTE:1", "NIGHT_VISION:0"]}
  9:  {xp: 50000, max-members: 30, max-claims: 60, vault-rows: 5, effects: ["SPEED:1", "HASTE:1", "NIGHT_VISION:0"]}
  10: {xp: 80000, max-members: 40, max-claims: 80, vault-rows: 6, effects: ["SPEED:1", "HASTE:1", "NIGHT_VISION:0", "REGENERATION:0"]}

# ---------------------------------------------------------------- Guerres
war:
  # prix pour déclarer, payé par la trésorerie de l'attaquant
  declare-cost: 5000
  # délai entre la déclaration et le début des combats
  preparation-seconds: 120
  duration-minutes: 30
  # la guerre s'arrête dès qu'une guilde atteint ce nombre de kills
  kills-to-win: 15
  # délai avant de pouvoir redéclarer la guerre à la même guilde
  cooldown-hours: 12
  # nombre minimum de défenseurs connectés pour pouvoir les attaquer
  min-online-defenders: 1
  # % de la trésorerie du perdant donné au gagnant
  loot-percent: 10
  # pendant la guerre, les ennemis peuvent casser/poser dans vos terrains
  allow-raiding: false
